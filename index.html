<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css?v=3">
<title>Naralingo — フランス語練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%239a7b45%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M11.5%209.5C9.6%207.3%209.2%205.1%2010%202.8M10.2%205.9%207.4%204.6M12.6%209.2c-.6-1.8-.1-3.4%201-4.6%22/%3E%3Cpath%20d%3D%22M20.5%209.5c1.9-2.2%202.3-4.4%201.5-6.7M21.8%205.9l2.8-1.3M19.4%209.2c.6-1.8.1-3.4-1-4.6%22/%3E%3Cpath%20d%3D%22M11.4%2011.6%206.6%2010.4c.9%201.9%202.6%203%204.9%203.1%22/%3E%3Cpath%20d%3D%22M20.6%2011.6l4.8-1.2c-.9%201.9-2.6%203-4.9%203.1%22/%3E%3Cpath%20d%3D%22M11.3%2011.2c.3-1.4%202.2-2.1%204.7-2.1s4.4.7%204.7%202.1l-1.1%208.2c-.5%203.6-1.9%206.4-3.6%206.4s-3.1-2.8-3.6-6.4z%22/%3E%3Ccircle%20cx%3D%2213.9%22%20cy%3D%2214.8%22%20r%3D%22.7%22%20fill%3D%22%239a7b45%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%2218.1%22%20cy%3D%2214.8%22%20r%3D%22.7%22%20fill%3D%22%239a7b45%22%20stroke%3D%22none%22/%3E%3Cpath%20d%3D%22M15%2024.3h2%22/%3E%3C/svg%3E">
<script src="config.js?v=4"></script>
<script src="common.js?v=4"></script>
</head>
<body>
<div class="wrap">
  <div class="crown">
    <div class="crest big"><svg width="44" height="44" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 9.5C9.6 7.3 9.2 5.1 10 2.8M10.2 5.9 7.4 4.6M12.6 9.2c-.6-1.8-.1-3.4 1-4.6"/><path d="M20.5 9.5c1.9-2.2 2.3-4.4 1.5-6.7M21.8 5.9l2.8-1.3M19.4 9.2c.6-1.8.1-3.4-1-4.6"/><path d="M11.4 11.6 6.6 10.4c.9 1.9 2.6 3 4.9 3.1"/><path d="M20.6 11.6l4.8-1.2c-.9 1.9-2.6 3-4.9 3.1"/><path d="M11.3 11.2c.3-1.4 2.2-2.1 4.7-2.1s4.4.7 4.7 2.1l-1.1 8.2c-.5 3.6-1.9 6.4-3.6 6.4s-3.1-2.8-3.6-6.4z"/><circle cx="13.9" cy="14.8" r=".7" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14.8" r=".7" fill="currentColor" stroke="none"/><path d="M15 24.3h2"/></svg></div>
    <h1 class="brand">Naralingo</h1>
    <div class="eyebrow" style="margin-top:10px">Français · フランス語練習</div>
  </div>

  <!-- ログイン -->
  <div class="panel hidden" id="loginPanel">
    <p class="hello">ログイン<small>先生から渡されたIDを入力してください。一度入力すると、この端末では次回から入力しなくて済みます。</small></p>
    <div class="idrow">
      <input type="text" id="idInput" class="idin" maxlength="20" autocomplete="off" autocapitalize="characters"
        spellcheck="false" placeholder="学生ID">
      <button class="idbtn" id="idBtn">ログイン</button>
    </div>
    <div class="note warn hidden" id="loginNote"></div>
  </div>

  <!-- メニュー -->
  <div class="panel hidden" id="menuPanel">
    <div class="bar">
      <p class="hello" id="hello" style="margin:0"></p>
      <div class="streak" id="streak"></div>
    </div>
    <div class="note" id="who"></div>
    <div class="sumgrid">
      <div class="sum"><div class="n" id="sTime">0分</div><div class="l">勉強時間</div></div>
      <div class="sum"><div class="n" id="sTries">0</div><div class="l">チャレンジ回数</div></div>
      <div class="sum"><div class="n" id="sAns">0</div><div class="l">累計解答</div></div>
      <div class="sum"><div class="n" id="sAcc">—</div><div class="l">通算正答率</div></div>
    </div>
    <div class="menu">
      <a class="card conj" href="conjugation.html">
        <div class="ico"><svg width="28" height="28" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 9.5C9.6 7.3 9.2 5.1 10 2.8M10.2 5.9 7.4 4.6M12.6 9.2c-.6-1.8-.1-3.4 1-4.6"/><path d="M20.5 9.5c1.9-2.2 2.3-4.4 1.5-6.7M21.8 5.9l2.8-1.3M19.4 9.2c.6-1.8.1-3.4-1-4.6"/><path d="M11.4 11.6 6.6 10.4c.9 1.9 2.6 3 4.9 3.1"/><path d="M20.6 11.6l4.8-1.2c-.9 1.9-2.6 3-4.9 3.1"/><path d="M11.3 11.2c.3-1.4 2.2-2.1 4.7-2.1s4.4.7 4.7 2.1l-1.1 8.2c-.5 3.6-1.9 6.4-3.6 6.4s-3.1-2.8-3.6-6.4z"/><circle cx="13.9" cy="14.8" r=".7" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14.8" r=".7" fill="currentColor" stroke="none"/><path d="M15 24.3h2"/></svg></div>
        <div class="tx"><div class="ti">動詞活用</div><div class="de">être · aller · avoir · faire ／ 直説法現在</div></div>
        <div class="st" id="stConj"></div>
      </a>
      <a class="card grammar" href="grammar.html">
        <div class="ico"><svg width="28" height="28" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.5c-1.2 5.5-1.3 11.4.8 15.6 2 4 10.4 4 12.4 0 2.1-4.2 2-10.1.8-15.6-3.1 2-10.9 2-14 0z"/><circle cx="12.8" cy="14.6" r="2.7"/><circle cx="19.2" cy="14.6" r="2.7"/><circle cx="12.8" cy="14.6" r=".8" fill="currentColor" stroke="none"/><circle cx="19.2" cy="14.6" r=".8" fill="currentColor" stroke="none"/><path d="M15.2 18.2l.8 1.5.8-1.5"/><path d="M12 23.2c1.3.8 2.7.8 4 0 1.3.8 2.7.8 4 0"/></svg></div>
        <div class="tx"><div class="ti">文法練習</div><div class="de">教科書『Accès』Leçon 1〜3</div></div>
        <div class="st" id="stGram"></div>
      </a>
      <a class="card talk" href="conversation.html">
        <div class="ico"><svg width="28" height="28" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20c.4-5 3.6-8.5 8-8.6.8-2.6 2.7-4.2 5.1-4.2 2.9 0 4.4 2.2 4.4 4.5l2.7 1.1-2.8 1.2c-.6 5.4-4.6 9-10.6 9H10l-5.5 2.6 2.7-4.2c.7-.6 1.5-1 1.8-1.4z"/><path d="M12.5 17c2.4 3.2 6.6 3 8.8.1"/><circle cx="22.8" cy="10.6" r=".75" fill="currentColor" stroke="none"/><path d="M14.5 23l-.6 3M18 23l.3 3"/></svg></div>
        <div class="tx"><div class="ti">会話練習</div><div class="de">暗記フレーズ集 100（第1〜14週）</div></div>
        <div class="st" id="stTalk"></div>
      </a>
    </div>
    <div class="note warn hidden" id="menuNote"></div>
    <div style="margin-top:22px;text-align:center"><button class="link hidden" id="logoutBtn">ログアウト</button></div>
  </div>
</div>

<script>
(function(){
  var Q=window.Quiz;
  var loginPanel=document.getElementById("loginPanel"), menuPanel=document.getElementById("menuPanel");
  function $(id){return document.getElementById(id);}

  function renderStreak(){
    var r=Q.streak();
    $("streak").innerHTML="連続 "+r.n+"日"+(r.doneToday?" <small>今日済</small>":(r.n>0?" <small>今日はまだ</small>":""));
  }
  function fmtDur(ms){var m=Math.round((ms||0)/60000);return m<60?m+"分":Math.floor(m/60)+"時間"+(m%60?(m%60)+"分":"");}
  function guestConj(){
    try{var s=JSON.parse(localStorage.getItem("conjQuizStats_v4"));
      if(s&&typeof s.tries==="number")return {tries:s.tries,answered:s.answered,correct:s.correct};}catch(e){}
    return null;
  }
  function renderMenu(){
    var u=Q.user();
    $("hello").textContent=u?u.name:"メニュー";
    $("who").textContent=u?"ID: "+u.id:(Q.SYNC_ON?"":"記録はこの端末に保存されます");
    $("logoutBtn").classList.toggle("hidden",!u);
    var who=u?u.id:"guest";
    function J(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
    var tot={time:0,tries:0,ans:0,cor:0};
    function addTot(x){if(!x||!x.tries)return;tot.time+=x.timeMs||0;tot.tries+=x.tries;tot.ans+=x.answered||0;tot.cor+=x.correct||0;}
    // 動詞活用
    var cj=u?J("conjQuizStats_v4_"+u.id):J("conjQuizStats_v4");addTot(cj);
    $("stConj").innerHTML=(cj&&cj.tries)?(cj.tries+"回<small>正答率 "+Math.round(cj.correct/cj.answered*100)+"%"+(cj.timeMs?" ・ "+fmtDur(cj.timeMs):"")+"</small>"):"";
    // 会話練習
    var t=J("talkQuiz_v1_"+who);addTot(t);
    if(t&&t.tries){var m=0;for(var k in (t.lv||{}))if(t.lv[k]>=4)m++;
      $("stTalk").innerHTML=t.tries+"回<small>習得 "+m+"/100"+(t.timeMs?" ・ "+fmtDur(t.timeMs):"")+"</small>";}else{$("stTalk").innerHTML="";}
    // 文法練習（Leçon 1〜3）
    var gT=0,clr=0,gt=0;
    for(var n=1;n<=3;n++){var g=J("gramQuiz_L"+n+"_v1_"+who);addTot(g);if(g&&g.tries){gT+=g.tries;gt+=g.timeMs||0;if(g.answered>=300)clr++;}}
    $("stGram").innerHTML=gT?(gT+"回<small>クリア "+clr+"/3"+(gt?" ・ "+fmtDur(gt):"")+"</small>"):"";
    $("sTime").textContent=fmtDur(tot.time);$("sTries").textContent=tot.tries;$("sAns").textContent=tot.ans;
    $("sAcc").textContent=tot.ans?Math.round(tot.cor/tot.ans*100)+"%":"—";
    renderStreak();
  }
  function showMenu(){loginPanel.classList.add("hidden");menuPanel.classList.remove("hidden");renderMenu();}
  function showLogin(){menuPanel.classList.add("hidden");loginPanel.classList.remove("hidden");}
  function note(t){var n=$("loginNote");n.textContent=t||"";n.classList.toggle("hidden",!t);}

  async function doLogin(){
    var btn=$("idBtn");btn.disabled=true;note("");
    var r=await Q.login($("idInput").value);
    btn.disabled=false;
    if(r.ok){$("idInput").value="";showMenu();return;}
    var v=" ［サーバー版: "+(r.version||"不明")+"］";
    note(r.error==="format"?"IDは英数字（3〜20文字）で入力してください。":
         r.error==="locked"?"試行回数が多すぎます。しばらくしてからやり直してください。"+v:
         r.error==="network"?"サーバーに接続できませんでした（"+(r.detail||"")+"）。通信環境、またはウェブアプリの公開設定（アクセス: 全員）を確認してください。":
         r.error==="server"?"サーバー側でエラーが出ました（"+(r.detail||"")+"）。"+v:
         "「"+r.id+"」は名簿に見つかりません。入力を確認してください。"+v);
  }
  $("idBtn").addEventListener("click",doLogin);
  $("idInput").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  $("logoutBtn").addEventListener("click",function(){Q.logout();note("");showLogin();});
  Q.onStats(function(){if(!menuPanel.classList.contains("hidden"))renderMenu();});

  if(Q.SYNC_ON&&!Q.user()){showLogin();return;}
  showMenu();
  Q.refresh().then(function(st){
    if(st==="auth"){Q.logout();showLogin();note("このIDは無効になっています。先生に確認してください。");}
  });
})();
</script>
</body>
</html>
