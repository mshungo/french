<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%239a7b45%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M11.3%2011.2c.3-1.4%202.2-2.1%204.7-2.1s4.4.7%204.7%202.1l-1.1%208.2c-.5%203.6-1.9%206.4-3.6%206.4s-3.1-2.8-3.6-6.4z%22/%3E%3Cpath%20d%3D%22M11.5%209.5C9.6%207.3%209.2%205.1%2010%202.8M20.5%209.5c1.9-2.2%202.3-4.4%201.5-6.7%22/%3E%3C/svg%3E">

<style>
  /* 読み込み中 */
  .sync-note{margin:0 0 10px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
  .sync-note.warn{color:#a2453f;}
  .loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 0 26px;color:var(--ink-soft);font-size:12.5px;}
  .loading .ld-deer{color:#c0a06a;animation:ldHop 1.1s ease-in-out infinite;}
  .loading .ld-bar{width:160px;height:5px;border-radius:5px;background:var(--accent-wash);overflow:hidden;position:relative;}
  .loading .ld-bar span{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-ink));animation:ldMove 1.2s ease-in-out infinite;}
  @keyframes ldHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes ldMove{0%{left:-40%}100%{left:100%}}
  /* 鹿コーチのひとこと */
  .deer-talk{display:flex;gap:12px;align-items:flex-start;margin:16px 0 4px;}
  .deer-av{flex:none;width:48px;height:48px;border-radius:50%;background:#fbf3e4;border:1px solid #efe0c2;display:flex;align-items:center;justify-content:center;color:#b08a3e;}
  .deer-bub{position:relative;flex:1;min-width:0;background:#fffaf1;border:1px solid #efe0c2;border-radius:16px;padding:11px 14px 12px;font-size:13px;line-height:1.75;color:var(--ink);}
  .deer-bub:before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:#fffaf1;border-left:1px solid #efe0c2;border-bottom:1px solid #efe0c2;transform:rotate(45deg);}
  .deer-bub .dn{display:block;font-size:11px;color:#b08a3e;letter-spacing:1px;margin-bottom:3px;font-weight:500;}
  .deer-bub p{margin:0;}
  .deer-bub p+p{margin-top:6px;}
  @media(prefers-reduced-motion:reduce){.loading .ld-deer,.loading .ld-bar span{animation:none}}
  .sec-h{font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;margin:26px 0 10px;display:flex;align-items:center;gap:12px;}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--rule);}
  table.apps{width:100%;border-collapse:collapse;font-size:13px;}
  table.apps th{font-weight:500;font-size:11px;color:var(--ink-faint);text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule);}
  table.apps th:first-child,table.apps td:first-child{text-align:left;}
  table.apps td{padding:9px 4px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;}
  .cal{display:grid;grid-template-columns:24px repeat(10,22px);gap:4px;align-items:center;justify-content:center;}
  .sumgrid .sum .n{font-size:20px;}
  .cal .dl{font-size:10px;color:var(--ink-faint);text-align:center;}
  .cal .c{width:22px;height:22px;border-radius:4px;background:#f1e9e3;}
  .cal .c.l1{background:#e9d3dd;} .cal .c.l2{background:#d6a8bd;} .cal .c.l3{background:#b5789a;} .cal .c.l4{background:#8f4f74;}
  .cal .c.today{outline:1.5px solid var(--gold);outline-offset:1px;}
  .cal .c.fut{background:transparent;}
  .legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10px;color:var(--ink-faint);margin-top:8px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;}
  .hours{display:flex;align-items:flex-end;gap:2px;height:96px;padding-top:6px;}
  .hours .b{flex:1;background:linear-gradient(180deg,#b48aa8,#8f667f);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
  .hours .b.z{background:#efe6df;}
  .hlab{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px;}
  .peak{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .recent{font-size:12.5px;}
  .recent .r{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline;}
  .recent .d{flex:none;width:96px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .recent .a{flex:1;min-width:0;}
  .recent .s{flex:none;font-variant-numeric:tabular-nums;color:var(--ink);}
  .msg-box{font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .card-box{margin-top:6px;}
  .card-img{border-radius:18px;overflow:hidden;border:1px solid var(--card-edge);background:#f8f1ea;min-height:120px;box-shadow:0 18px 40px -28px rgba(90,60,70,.55);}
  .card-img img{display:block;width:100%;height:auto;}
  .card-wait{padding:50px 0;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .card-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .card-btns button{flex:1 1 140px;padding:11px 14px;border:1px solid var(--accent-ink);border-radius:22px;background:#fff;color:var(--accent-ink);font:inherit;font-size:13px;cursor:pointer;}
  .card-btns .cb-main{background:var(--accent-ink);color:#fff;}
  .card-btns button:disabled{opacity:.5;cursor:default;}
  .card-note{font-size:11.5px;color:var(--ink-soft);line-height:1.7;margin:10px 2px 0;}
  .export{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding:13px 15px;border:1px solid var(--card-edge);border-radius:14px;background:#fdf9f6;}
  .export p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.6;flex:1 1 180px;}
  .export button{flex:none;padding:9px 16px;border:1px solid var(--accent-ink);border-radius:20px;background:#fff;color:var(--accent-ink);font:inherit;font-size:13px;cursor:pointer;}
  .export button:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>
<div class="wrap">
  <div class="crown">
    <div class="crest"><svg width="30" height="30" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 9.5C9.6 7.3 9.2 5.1 10 2.8M10.2 5.9 7.4 4.6M12.6 9.2c-.6-1.8-.1-3.4 1-4.6"/><path d="M20.5 9.5c1.9-2.2 2.3-4.4 1.5-6.7M21.8 5.9l2.8-1.3M19.4 9.2c.6-1.8.1-3.4-1-4.6"/><path d="M11.4 11.6 6.6 10.4c.9 1.9 2.6 3 4.9 3.1"/><path d="M20.6 11.6l4.8-1.2c-.9 1.9-2.6 3-4.9 3.1"/><path d="M11.3 11.2c.3-1.4 2.2-2.1 4.7-2.1s4.4.7 4.7 2.1l-1.1 8.2c-.5 3.6-1.9 6.4-3.6 6.4s-3.1-2.8-3.6-6.4z"/><circle cx="13.9" cy="14.8" r=".7" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14.8" r=".7" fill="currentColor" stroke="none"/><path d="M15 24.3h2"/></svg></div>
    <div class="eyebrow">Naralingo · Mon parcours</div>
    <h1>学習記録</h1>
  </div>
  <div class="panel">
    <div class="bar"><a class="link" href="index.html">← メニュー</a><div class="streak" id="streak"></div></div>
    <p class="hello" id="hello" style="margin-top:14px">読み込み中…</p>
    <div id="body"></div>
  </div>
</div>
<script>
(function(){
  var Q=window.Quiz;
  if(!Q.requireLogin())return;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function dur(sec){var m=Math.round((sec||0)/60);return m<60?m+"分":Math.floor(m/60)+"時間"+(m%60?(m%60)+"分":"");}
  var APP={conj:"動詞活用",grammar:"文法練習",talk:"会話練習"};
  var TALKSEC={s1:"第1–3週",s2:"第4–6週",s3:"第7–9週",s4:"第10–11週",s5:"第12–14週",mix:"総まとめ",weak:"苦手"};
  function secName(app,s){
    if(app==="grammar"){var m=/^L(\d+)-(.+)$/.exec(s);if(m)return "Leçon "+m[1]+(m[2]==="mix"?" 総まとめ":m[2]==="weak"?" 苦手":"");}
    if(app==="talk")return TALKSEC[s]||s;
    return s;
  }
  var r0=Q.streak();$("streak").innerHTML="連続 "+r0.n+"日";
  var u=Q.user();
  if(!Q.SYNC_ON||!u){$("hello").textContent="学習記録";$("body").innerHTML='<p class="msg-box">記録の送信が有効になっていないため、ここには表示できません。</p>';return;}
  if(u.practice){$("hello").textContent="学習記録";$("body").innerHTML='<p class="msg-box">練習用IDでは、学習記録は残りません。自分のIDでログインすると、ここに記録が表示されます。</p>';return;}
  $("hello").innerHTML=esc(u.name&&u.name!==u.id?u.name:"学習記録")+'<small>ID: '+esc(u.id)+'　（学習記録はログインした本人だけが見られます）</small>';
  /* 前回の記録があれば、まずそれをすぐ出して、うしろで最新に入れかえる */
  var hc=Q.cachedHistory(),shown=false;
  function syncNote(t,warn){var b=$("body"),n=b.querySelector(".sync-note");if(!t){if(n)n.remove();return;}
    if(!n){n=document.createElement("p");n.className="sync-note";b.insertBefore(n,b.firstChild);}n.textContent=t;n.classList.toggle("warn",!!warn);}
  if(hc&&hc.history){render(hc.history,hc.agg||null);shown=true;syncNote("最新の記録を確認しています…");}
  else{
    $("body").innerHTML='<div class="loading" role="status"><span class="ld-deer"><svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 9.5C9.6 7.3 9.2 5.1 10 2.8M10.2 5.9 7.4 4.6M12.6 9.2c-.6-1.8-.1-3.4 1-4.6"/><path d="M20.5 9.5c1.9-2.2 2.3-4.4 1.5-6.7M21.8 5.9l2.8-1.3M19.4 9.2c.6-1.8.1-3.4-1-4.6"/><path d="M11.4 11.6 6.6 10.4c.9 1.9 2.6 3 4.9 3.1"/><path d="M20.6 11.6l4.8-1.2c-.9 1.9-2.6 3-4.9 3.1"/><path d="M11.3 11.2c.3-1.4 2.2-2.1 4.7-2.1s4.4.7 4.7 2.1l-1.1 8.2c-.5 3.6-1.9 6.4-3.6 6.4s-3.1-2.8-3.6-6.4z"/><circle cx="13.9" cy="14.8" r=".8" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14.8" r=".8" fill="currentColor" stroke="none"/><path d="M15 24.3h2"/></svg></span>'+
      '<div class="ld-bar"><span></span></div><div>記録を読み込んでいます…</div></div>';
  }
  Q.history().then(function(res){
    if(!res.ok){
      if(shown){syncNote("最新の記録を読み込めなかったため、前回の記録を表示しています。",true);return;}
      $("body").innerHTML='<p class="msg-box warn">'+(res.error==="rate"?"読み込みが多すぎます。少し待ってから開き直してください。":res.error==="auth"?"このIDは無効になっています。先生に確認してください。":"記録を読み込めませんでした。通信環境を確認してください。")+'</p>';return;}
    render(res.history||[],res.agg||null);
  });

  /* Excel で保存（読み込み機能はつけない） */
  function loadXlsx(){
    return new Promise(function(ok,ng){
      if(window.XLSX)return ok();
      var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload=function(){ok();};s.onerror=function(){ng(new Error("load"));};document.head.appendChild(s);
    });
  }
  function exportXlsx(H,btn,G){
    btn.disabled=true;var label=btn.textContent;btn.textContent="作成中…";
    loadXlsx().then(function(){
      var rows=[["日時","教材","項目","正解数","問題数","正答率","学習時間（分）"]];
      H.forEach(function(x){rows.push([x.t.replace("T"," "),APP[x.app]||"",secName(x.app,x.sec),x.score,x.total,x.total?Math.round(x.score/x.total*100)/100:"",Math.round((x.dur||0)/6)/10]);});
      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"]=[{wch:17},{wch:10},{wch:18},{wch:8},{wch:8},{wch:8},{wch:14}];
      for(var i=2;i<=rows.length;i++){var c=ws["F"+i];if(c&&c.t==="n")c.z="0%";}
      var by={},days={};
      if(G){Object.keys(G.apps||{}).forEach(function(k){var a=G.apps[k];by[k]={n:a.n,q:a.q,c:a.c,d:a.dur};});days=G.dayCount||{};}
      else H.forEach(function(x){var a=by[x.app]=by[x.app]||{n:0,q:0,c:0,d:0};a.n++;a.q+=x.total;a.c+=x.score;a.d+=x.dur||0;days[x.t.slice(0,10)]=1;});
      var sum=[["学生ID",u.id],["保存した日",Q.todayJST()],["学習した日数",Object.keys(days).length],[],["教材","回数","解答数","正答率","学習時間（分）"]];
      var foot=["（「学習記録」シートは最近の "+H.length+" ラウンド。まとめは全期間）"];
      ["conj","grammar","talk"].forEach(function(k){var a=by[k]||{n:0,q:0,c:0,d:0};sum.push([APP[k],a.n,a.q,a.q?Math.round(a.c/a.q*100)/100:"",Math.round(a.d/6)/10]);});
      sum.push([]);sum.push(foot);
      var ws2=XLSX.utils.aoa_to_sheet(sum);
      ws2["!cols"]=[{wch:12},{wch:20},{wch:10},{wch:10},{wch:14}];
      for(var j=6;j<=8;j++){var c2=ws2["D"+j];if(c2&&c2.t==="n")c2.z="0%";}
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws2,"まとめ");XLSX.utils.book_append_sheet(wb,ws,"学習記録");
      var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      var link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="Naralingo_record_"+u.id+"_"+Q.todayJST()+".xlsx";
      document.body.appendChild(link);link.click();setTimeout(function(){URL.revokeObjectURL(link.href);link.remove();},4000);
      btn.textContent=label;btn.disabled=false;
    }).catch(function(){btn.textContent="保存できませんでした（もう一度押す）";btn.disabled=false;});
  }
  /* 鹿コーチのひとこと（中身は coach.js）：声かけ・勉強のコツ・フランスの小話 */
  var deerData=null;
  function deerTalk(d){
    deerData=d;
    return '<div class="deer-talk" id="deerTalk"><div class="deer-av">'+'<svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 9.5C9.6 7.3 9.2 5.1 10 2.8M10.2 5.9 7.4 4.6M12.6 9.2c-.6-1.8-.1-3.4 1-4.6"/><path d="M20.5 9.5c1.9-2.2 2.3-4.4 1.5-6.7M21.8 5.9l2.8-1.3M19.4 9.2c.6-1.8.1-3.4-1-4.6"/><path d="M11.4 11.6 6.6 10.4c.9 1.9 2.6 3 4.9 3.1"/><path d="M20.6 11.6l4.8-1.2c-.9 1.9-2.6 3-4.9 3.1"/><path d="M11.3 11.2c.3-1.4 2.2-2.1 4.7-2.1s4.4.7 4.7 2.1l-1.1 8.2c-.5 3.6-1.9 6.4-3.6 6.4s-3.1-2.8-3.6-6.4z"/><circle cx="13.9" cy="14.8" r=".8" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14.8" r=".8" fill="currentColor" stroke="none"/><path d="M15 24.3h2"/></svg>'+'</div><div class="deer-bub"><span class="dn">鹿コーチから</span><div class="dc-body"></div></div></div>';
  }
  function mountDeer(){
    var el=$("deerTalk");if(!el||!window.Coach||!deerData)return;
    var d=deerData;d.id=u.id;d.today=Q.todayJST();d.streak=Q.streak();
    Coach.mount(el,d);
  }
  /* 成果カード：端末に残っている進み具合（文法の達成・会話の習得・ランク・バッジ）と、サーバーの集計から描く */
  function J(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  var LN={1:108,2:105,3:97,4:124,5:105,6:115};   // 各 Leçon の問題数（grammar.html と同じ）
  function rankOf(ms){if(ms==null)return null;var s=ms/1000;return s<=20?"SSS":s<=30?"SS":s<=45?"S":s<=60?"A":s<=120?"B":"C";}
  function cardData(d){
    var id=u.id,badges=0,gram=[];
    for(var n=1;n<=6;n++){
      var g=J("gramQuiz_L"+n+"_v1_"+id)||{},m=0,ch=0;
      for(var k in (g.it||{})){var x=g.it[k];if(x.wk)continue;var run=x.run!=null?x.run:(x.last===1?Math.min(x.c,1):0);if((x.wrun||0)>=2||x.m)m++;else if(run>=2)ch++;}
      var N=(g.sum&&g.sum.n)||LN[n];gram.push({no:n,n:N,m:Math.min(m,N),ch:Math.min(ch,N-Math.min(m,N))});
      badges+=Object.keys(g.badges||{}).length;
    }
    var t=J("talkQuiz_v1_"+id)||{},tm=0;for(var k2 in (t.lv||{}))if(t.lv[k2]>=4)tm++;
    badges+=Object.keys(t.badges||{}).length;
    var cj=J("conjQuizStats_v4_"+id)||{},ranks={};
    ["être","aller","avoir","faire"].forEach(function(v){ranks[v]=rankOf((cj.bestTimes||{})[v]);});
    var ca=d.byApp.conj;
    var st=Q.streak(),q=window.Coach?Coach.pickStory(Math.floor(Date.now()/86400000)):null;
    while(q&&!q.fr)q=Coach.pickStory(Math.floor(Math.random()*1000));
    return {date:Q.todayJST().replace(/-/g,"."),durSec:d.dur,days:Object.keys(d.days).length,streak:st.n,acc:d.q?Math.round(d.c/d.q*100):null,
      gram:gram,talk:{m:tm,n:100},conj:{acc:ca&&ca.q?Math.round(ca.c/ca.q*100):null,ranks:ranks},badges:badges,quote:q};
  }
  /* 成果カードは、ボタンを押したときだけ端末の中で描く（サーバーは使わない）。
     中身が前回と同じなら描き直さず、前の画像をそのまま使う。 */
  var cardURL=null,cardSig="",cardSrc=null;
  function showCard(btn){
    var box=$("cardImg");box.classList.remove("hidden");
    box.innerHTML='<img alt="成果カード：学習時間・学習した日・正答率・各教材の達成のグラフ" src="'+cardURL+'">';
    btn.disabled=false;btn.textContent="画像で保存";
    btn.onclick=function(){var a=document.createElement("a");a.href=cardURL;a.download="Naralingo_"+Q.todayJST()+".png";document.body.appendChild(a);a.click();a.remove();};
  }
  function makeCard(d,btn){
    if(!window.NLCard||!d)return;
    var data=cardData(d),sig=JSON.stringify([data.durSec,data.days,data.streak,data.acc,data.gram,data.talk,data.conj,data.badges,data.date]);
    if(cardURL&&sig===cardSig){showCard(btn);return;}
    btn.disabled=true;btn.textContent="作成中…";
    var sample="0123456789%分時間日連続学習のきろく通算正答率動詞活用文法練習会話練習達成率フレーズバッジ個ランク記述式で習得選択できたLeçon"+(data.quote?data.quote.ja:"");
    NLCard.ready(sample).then(function(){
      var cv=NLCard.draw(data);
      cv.toBlob(function(b){
        if(!b){btn.disabled=false;btn.textContent="成果カードを作る";return;}
        if(cardURL)URL.revokeObjectURL(cardURL);cardURL=URL.createObjectURL(b);cardSig=sig;
        cv.width=cv.height=0;   // 描いたキャンバスのメモリを手放す
        showCard(btn);
      },"image/png");
    });
  }
  function render(H,G){
    var pend=Q.pendingCount();
    if(!H.length&&!(G&&G.dur)){$("body").innerHTML=deerTalk({rounds:0,dur:0,days:{},hours:[],byApp:{},q:0,c:0})+'<p class="msg-box">まだ記録がありません。練習すると、ここに回数や時間帯が表示されます。'+(pend?'<br>（未送信の結果が '+pend+' 件あります）':'')+'</p>';mountDeer();return;}
    var totDur=0,totQ=0,totC=0,days={},hours=[],byApp={},rounds=0;
    if(G){   // サーバーが持っている全期間の集計（新しい版）
      totDur=G.dur||0;days=G.dayCount||{};hours=(G.hours||[]).slice(0,24);while(hours.length<24)hours.push(0);
      Object.keys(G.apps||{}).forEach(function(k){var a=G.apps[k];byApp[k]={n:a.n,q:a.q,c:a.c,dur:a.dur};totQ+=a.q;totC+=a.c;rounds+=a.n;});
    }else{   // 旧版サーバー：最近の記録から数える
      for(var h=0;h<24;h++)hours.push(0);
      H.forEach(function(x){
        totDur+=x.dur||0;totQ+=x.total;totC+=x.score;rounds++;
        var d=x.t.slice(0,10);days[d]=(days[d]||0)+1;
        var hr=+x.t.slice(11,13);if(hr>=0&&hr<24)hours[hr]++;
        var a=byApp[x.app]=byApp[x.app]||{n:0,q:0,c:0,dur:0};a.n++;a.q+=x.total;a.c+=x.score;a.dur+=x.dur||0;
      });
    }
    var html=deerTalk({rounds:rounds,dur:totDur,days:days,hours:hours,byApp:byApp,q:totQ,c:totC});
    html+='<div class="sumgrid">'+
      '<div class="sum"><div class="n">'+dur(totDur)+'</div><div class="l">学習時間</div></div>'+
      '<div class="sum"><div class="n">'+Object.keys(days).length+'</div><div class="l">学習した日</div></div>'+
      '<div class="sum"><div class="n">'+rounds+'</div><div class="l">ラウンド</div></div>'+
      '<div class="sum"><div class="n">'+(totQ?Math.round(totC/totQ*100)+'%':'—')+'</div><div class="l">正答率</div></div></div>';
    // 教材別
    html+='<div class="sec-h">教材ごと</div><table class="apps"><tr><th>教材</th><th>回数</th><th>解答数</th><th>正答率</th><th>時間</th></tr>';
    ["conj","grammar","talk"].forEach(function(k){var a=byApp[k];
      html+='<tr><td>'+APP[k]+'</td><td>'+(a?a.n:0)+'</td><td>'+(a?a.q:0)+'</td><td>'+(a&&a.q?Math.round(a.c/a.q*100)+'%':'—')+'</td><td>'+(a?dur(a.dur):'0分')+'</td></tr>';});
    html+='</table>';
    // カレンダー（直近10週）
    var today=Q.todayJST(),t0=new Date(today+"T00:00:00Z");
    var dow=(t0.getUTCDay()+6)%7;           // 月曜=0
    var start=new Date(t0);start.setUTCDate(start.getUTCDate()-dow-7*9);
    var labels=["月","火","水","木","金","土","日"];
    html+='<div class="sec-h">最近10週間の学習日（色が濃いほど多く練習）</div><div class="cal">';
    for(var r=0;r<7;r++){
      html+='<div class="dl">'+labels[r]+'</div>';
      for(var w=0;w<10;w++){
        var d=new Date(start);d.setUTCDate(start.getUTCDate()+w*7+r);var ds=d.toISOString().slice(0,10);
        var n=days[ds]||0,lv=n===0?"":n<2?"l1":n<4?"l2":n<7?"l3":"l4";
        var fut=ds>today;
        html+='<div class="c '+lv+(ds===today?" today":"")+(fut?" fut":"")+'" title="'+ds+'：'+n+'回"></div>';
      }
    }
    html+='</div><div class="legend">少<i style="background:#f1e9e3"></i><i style="background:#e9d3dd"></i><i style="background:#d6a8bd"></i><i style="background:#b5789a"></i><i style="background:#8f4f74"></i>多</div>';
    // 時間帯
    var mx=Math.max.apply(null,hours)||1,peak=hours.indexOf(Math.max.apply(null,hours));
    html+='<div class="sec-h">よく練習する時間帯</div><div class="hours">';
    hours.forEach(function(v,i){html+='<div class="b'+(v?'':' z')+'" style="height:'+(v?Math.max(6,Math.round(v/mx*100)):3)+'%" title="'+i+'時台：'+v+'回"></div>';});
    html+='</div><div class="hlab"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>';
    html+='<div class="peak">いちばん多いのは '+peak+'時台（'+hours[peak]+'回）</div>';
    // 最近の記録
    html+='<div class="sec-h">最近の記録</div><div class="recent">';
    H.slice(-15).reverse().forEach(function(x){
      html+='<div class="r"><span class="d">'+esc(x.t.slice(5,10).replace("-","/"))+' '+esc(x.t.slice(11,16))+'</span>'+
        '<span class="a">'+(APP[x.app]||"")+' <span style="color:var(--ink-faint)">'+esc(secName(x.app,x.sec))+'</span></span>'+
        '<span class="s">'+x.score+' / '+x.total+'</span></div>';
    });
    html+='</div>';
    if(pend)html+='<p class="note">未送信の結果が '+pend+' 件あります（次に練習ページを開いたときに送られます）。</p>';
    html+='<div class="sec-h">成果カード</div>'+
      '<div class="card-box"><div class="card-img hidden" id="cardImg"></div>'+
      '<div class="card-btns"><button type="button" class="cb-main" id="pngBtn">成果カードを作る</button><button type="button" id="xlsxBtn">Excel で保存（くわしい記録）</button></div>'+
      '<p class="card-note">記録は自動で保存されています。成果カードには名前もIDも入らないので、友だちに見せても大丈夫。スマホでは、画像を長押しして保存することもできます。</p></div>';
    $("body").innerHTML=html;
    mountDeer();
    $("xlsxBtn").onclick=function(){exportXlsx(H,this,G);};
    cardSrc={rounds:rounds,dur:totDur,days:days,byApp:byApp,q:totQ,c:totC};
    $("pngBtn").onclick=function(){makeCard(cardSrc,this);};
  }
})();
</script>
</body>
</html>
