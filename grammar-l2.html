<script>
/* ===== Leçon 2：主語人称代名詞、指示形容詞、所有形容詞（-er動詞・être / avoir は verbs.html へ） ===== */
window.LESSON={no:2,title:"主語と限定詞",sub:"pronoms · démonstratifs · possessifs",
  lead:"主語人称代名詞と、「この」「私の」などを練習します。動詞の活用は「動詞活用」で練習できます。",
  sections:[
  {k:"pro",t:"主語人称代名詞",d:"je, tu, il… / on（Grammaire 1 ／ En plus 1）",c:"#cf8aa0",ci:"#b16880",cw:"#faeef2",
   memo:'<table><tr><th></th><th>単数</th><th>複数</th></tr><tr><td>1人称</td><td class="fr">je (j\')</td><td class="fr">nous</td></tr><tr><td>2人称</td><td class="fr">tu</td><td class="fr">vous</td></tr><tr><td>3人称</td><td class="fr">il / elle</td><td class="fr">ils / elles</td></tr></table>'+
   '<p>tu は親しい相手1人。vous は丁寧な「あなた」と、複数の「あなたたち・きみたち」。</p>'+
   '<p>il / elle は人にも物にも使う。男女まざった複数は <span class="fr">ils</span>。</p>'+
   '<p><span class="fr">on</span>：「人々は」「だれかが」「私たちは」。文法上は3人称単数（il と同じ活用）。</p>'},
      {k:"dem",t:"指示形容詞",d:"ce / cet / cette / ces（Grammaire 4）",c:"#92a6cf",ci:"#7186b4",cw:"#eef1f8",
   memo:'<table><tr><th>男性単数</th><th>女性単数</th><th>複数</th></tr><tr><td class="fr">ce (cet)</td><td class="fr">cette</td><td class="fr">ces</td></tr></table>'+
   '<p>母音・無音のhで始まる男性単数名詞の前では <span class="fr">cet</span>：cet arbre, cet hôtel。女性名詞は母音で始まっても cette。</p>'},
  {k:"pos",t:"所有形容詞",d:"mon, ma, mes…（Grammaire 5）と数 11〜20",c:"#b48aa8",ci:"#8f667f",cw:"#f6eef3",
   memo:'<table><tr><th></th><th>男性単数</th><th>女性単数</th><th>複数</th></tr>'+
   '<tr><td>私の</td><td class="fr">mon</td><td class="fr">ma (mon)</td><td class="fr">mes</td></tr>'+
   '<tr><td>きみの</td><td class="fr">ton</td><td class="fr">ta (ton)</td><td class="fr">tes</td></tr>'+
   '<tr><td>彼の・彼女の</td><td class="fr">son</td><td class="fr">sa (son)</td><td class="fr">ses</td></tr>'+
   '<tr><td>私たちの</td><td colspan="2" class="fr">notre</td><td class="fr">nos</td></tr>'+
   '<tr><td>あなた(たち)の</td><td colspan="2" class="fr">votre</td><td class="fr">vos</td></tr>'+
   '<tr><td>彼らの</td><td colspan="2" class="fr">leur</td><td class="fr">leurs</td></tr></table>'+
   '<p>形を決めるのは<b>あとの名詞の性・数</b>（持ち主の性ではない）：<span class="fr">sa mère</span>＝彼の母／彼女の母。</p>'+
   '<p>母音で始まる女性単数名詞の前では mon / ton / son：<span class="fr">mon amie</span></p>'+
   '<p>数：onze, douze, treize, quatorze, quinze, seize, dix-sept, dix-huit, dix-neuf, vingt</p>'}
]};

/* ---------- 主語人称代名詞 ---------- */
/* 主語（名詞）を代名詞に置きかえる問題。文の形で出すので、動詞の形（est / sont など）も手がかりになる */
const P6=["Il","Elle","Ils","Elles"];
const PH_=["主語を代名詞に"];
C("pro","Mon oncle est médecin. → ___ est médecin.","Il",P6,"mon oncle（男性・1人）→ il。",{ja:"おじは医者だ。",h:PH_});
C("pro","Ma tante habite à Kyoto. → ___ habite à Kyoto.","Elle",P6,"ma tante（女性・1人）→ elle。",{ja:"おばは京都に住んでいる。",h:PH_});
C("pro","Paul et Marie sont étudiants. → ___ sont étudiants.","Ils",P6,"男女まざった複数 → ils。",{ja:"ポールとマリーは学生だ。",h:PH_});
C("pro","Léa et Chloé chantent bien. → ___ chantent bien.","Elles",P6,"女性だけの複数 → elles。",{ja:"レアとクロエは歌がうまい。",h:PH_});
C("pro","Ce livre est intéressant. → ___ est intéressant.","Il",P6,"物にも il / elle を使う（「それは」）。livre は男性名詞 → il。",{ja:"この本はおもしろい。",h:PH_});
C("pro","La table est grande. → ___ est grande.","Elle",P6,"table は女性名詞 → elle（「それは」）。",{ja:"そのテーブルは大きい。",h:PH_});
C("pro","Ces fleurs sont belles. → ___ sont belles.","Elles",P6,"fleur は女性名詞の複数 → elles。",{ja:"これらの花はきれいだ。",h:PH_});
C("pro","Mes parents travaillent à Osaka. → ___ travaillent à Osaka.","Ils",P6,"両親（男女）→ ils。",{ja:"両親は大阪で働いている。",h:PH_});
C("pro","Les voitures sont chères. → ___ sont chères.","Elles",P6,"voiture は女性名詞の複数 → elles。",{ja:"車は高い。",h:PH_});
C("pro","Mon frère et moi aimons le sport. → ___ aimons le sport.","Nous",["Nous","Vous","Ils"],"「私」を含む複数 → nous（動詞も aimons）。",{ja:"兄と私はスポーツが好きだ。",h:PH_});
C("pro","Ta mère et toi êtes en vacances ? → ___ êtes en vacances ?","Vous",["Vous","Nous","Ils","Elles"],"「きみ」を含む複数 → vous（動詞も êtes）。",{ja:"きみとお母さんは休暇中？",h:PH_});
C("pro","___ es fatigué, papa ?","Tu",["Tu","Vous"],"家族など親しい相手1人 → tu（être は tu es）。",{ja:"パパ、疲れてる？"});
C("pro","___ êtes professeur, madame ?","Vous",["Vous","Tu"],"初対面・目上の人 → vous（être は vous êtes）。",{ja:"先生でいらっしゃいますか？"});
C("pro","___ êtes prêts, les enfants ?","Vous",["Vous","Tu"],"親しい相手でも複数なら vous。",{ja:"みんな、準備できた？"});
C("pro","Au Québec, on parle français. の on は？","人々は（一般）",["人々は（一般）","私たちは","だれかが"],"「ケベックでは（人々は）フランス語を話す」。一般の人々を表す on。",{cw:false});
C("pro","Ce soir, on dîne ensemble ? の on は？","私たちは",["私たちは","人々は（一般）","だれかが"],"会話で on は nous のかわりによく使われる。",{cw:false});
C("pro","On frappe à la porte. の on は？","だれかが",["だれかが","私たちは","人々は（一般）"],"「だれかがドアをノックしている」。",{cw:false});
C("pro","Nous, on ___ le cinéma.（aimer）","aime",["aime","aimons","aiment"],"on は3人称単数扱い → il と同じ aime。",{ja:"私たちは映画が好きなんだ。"});

/* ---------- -er動詞 ---------- */
SKIP(21);   // この21問は「動詞活用」の「いろいろな動詞」（verbs-data.js）へ移した。ほかの問題の番号（＝記録）を保つため、番号だけ進める

/* ---------- être と avoir ---------- */
SKIP(23);   // この23問は「動詞活用」の「いろいろな動詞」（verbs-data.js）へ移した。ほかの問題の番号（＝記録）を保つため、番号だけ進める

/* ---------- 指示形容詞 ---------- */
const DEM=["ce","cet","cette","ces"];
C("dem","___ livre","ce",DEM,"子音で始まる男性単数 → ce。",{ja:"この本"});
C("dem","___ maison","cette",DEM,"女性単数 → cette。",{ja:"この家"});
C("dem","___ arbre","cet",DEM,"母音で始まる男性単数 → cet。",{ja:"この木"});
C("dem","___ homme","cet",DEM,"無音の h で始まる男性単数 → cet。",{ja:"この男性"});
C("dem","___ amie","cette",DEM,"女性名詞は母音で始まっても cette。",{ja:"この女友だち"});
C("dem","___ enfants","ces",DEM,"複数 → 男性・女性とも ces。",{ja:"この子どもたち"});
C("dem","___ hôtel","cet",DEM,"hôtel は無音の h で始まる男性名詞 → cet。",{ja:"このホテル"});
C("dem","___ école","cette",DEM,"école は女性名詞 → cette。",{ja:"この学校"});
C("dem","___ matin","ce",DEM,"ce matin＝今朝。",{ja:"今朝"});
C("dem","___ semaine","cette",DEM,"cette semaine＝今週。",{ja:"今週"});
C("dem","___ ordinateur","cet",DEM,"ordinateur は母音で始まる男性名詞 → cet。",{ja:"このパソコン"});
C("dem","___ fleurs","ces",DEM,"複数 → ces。",{ja:"これらの花"});
C("dem","___ été","cet",DEM,"été（夏）は母音で始まる男性名詞 → cet été＝この夏。",{ja:"この夏"});
C("dem","___ année","cette",DEM,"année は女性名詞 → cette année＝今年。",{ja:"今年"});
C("dem","___ soir","ce",DEM,"ce soir＝今晩。",{ja:"今晩"});
C("dem","___ étudiants","ces",DEM,"複数 → ces（母音の前でリエゾン）。",{ja:"この学生たち"});

/* ---------- 所有形容詞 ---------- */
C("pos","（私の）___ père","mon",["mon","ma","mes"],"père は男性単数 → mon。");
C("pos","（私の）___ sœur","ma",["ma","mon","mes"],"sœur は女性単数 → ma。");
C("pos","（私の）___ amie","mon",["mon","ma","mes"],"母音で始まる女性単数名詞の前では ma → mon（mon amie）。");
C("pos","（きみの）___ chaussures","tes",["tes","ton","ta","vos"],"複数 → tes。");
C("pos","（彼の）___ mère","sa",["sa","son","ses","leur"],"mère は女性 → sa。持ち主（彼）の性は関係ない。");
C("pos","（彼女の）___ frère","son",["son","sa","ses","leur"],"frère は男性 → son。持ち主が女性でも son。");
C("pos","（私たちの）___ professeur","notre",["notre","nos","votre"],"単数 → notre。");
C("pos","（あなたの）___ passeport","votre",["votre","vos","ton"],"単数 → votre。");
C("pos","（彼らの）___ enfants","leurs",["leurs","leur","ses"],"「彼らの」＋複数 → leurs。");
C("pos","（彼らの）___ maison","leur",["leur","leurs","sa"],"「彼らの」＋単数 → leur。");
C("pos","（きみの）___ école","ton",["ton","ta","tes"],"école は母音で始まる女性名詞 → ta ではなく ton。");
C("pos","（彼女の）___ adresse","son",["son","sa","ses"],"adresse は母音で始まる女性名詞 → son。");
C("pos","（あなたたちの）___ valises","vos",["vos","votre","leurs"],"複数 → vos。");
C("pos","（私たちの）___ voisins","nos",["nos","notre","vos"],"複数 → nos。");
T("pos","名詞を複数にして書きかえる（動詞も変える）","Mon ami habite à Paris.",["Mes amis habitent à Paris."],"mon → mes、ami → amis、habite → habitent。");
T("pos","名詞を複数にして書きかえる（動詞も変える）","Sa fille travaille à Lyon.",["Ses filles travaillent à Lyon."],"sa → ses、travaille → travaillent。");
T("pos","名詞を複数にして書きかえる（動詞も変える）","Notre voisin chante bien.",["Nos voisins chantent bien."],"notre → nos、chante → chantent。");
T("pos","名詞を複数にして書きかえる（動詞も変える）","Ton chat mange beaucoup.",["Tes chats mangent beaucoup."],"ton → tes、mange → mangent。");
B("pos","私たちはいっしょに日本語を勉強している。","Nous étudions le japonais ensemble.",["étudiez","un"],"nous → étudions。言語名には定冠詞。");
B("pos","彼女の兄弟たちは東京に住んでいる。","Ses frères habitent à Tokyo.",["Leurs","habite"],"「彼女の」＋複数 → ses。");
B("pos","このホテルはとても高い。","Cet hôtel est très cher.",["Ce","a"],"無音の h の前 → cet。");
B("pos","私は20歳です。","J'ai vingt ans.",["suis","Je"],"年齢は avoir。",{cap:true});
C("pos","15 は？","quinze",["quinze","quatorze","cinq","seize"],"quinze＝15、quatorze＝14、seize＝16。");
C("pos","12 は？","douze",["douze","deux","treize","onze"],"douze＝12。");
C("pos","« dix-sept » はいくつ？","17",["17","7","16","70"],"dix-sept＝10＋7。",{cw:false});
W("pos","20 ＝ ___","vingt","vingt［vɛ̃］。g と t は発音しない。");
W("pos","13 ＝ ___","treize","treize。");

/* ---------- 並べかえ（追加）：レア・ゆい・ユゴー・マルタン先生の小さな物語 ----------
   あとから足した問題。問題IDは通し番号なので、ほかの問題の記録をずらさないよう、必ずいちばん最後に足す */
B("pro","【ゆいがマルタン先生に】マルタン先生、先生はリヨンのご出身ですか？","Vous êtes de Lyon, Madame Martin ?",["tu","est"],"目上の人には vous。être は vous êtes。");
B("pro","【レアの両親について】彼らは日本のお菓子が大好きだ。","Ils adorent les gâteaux du Japon.",["elles","adore"],"男女まざった複数（両親）→ ils。動詞は adorent。");
B("pro","【ゆいがレアをさそう】レア、駅のカフェで食べようか？","Léa, on mange au café de la gare ?",["mangeons","manges"],"on は「私たち」の意味でも3人称単数あつかい → mange。");
B("pro","【マルタン先生がメッセージで】レア、ゆい、二人とも奈良公園にいるの？","Léa et Yui, vous êtes au parc de Nara ?",["tu","es"],"親しい相手でも2人なら vous（être は vous êtes）。");
B("pro","【ゆいの自己紹介】私は奈良の、公園の近くに住んでいます。","J'habite à Nara, près du parc.",["je","habite"],"母音で始まる動詞の前で je → j'。j'habite と1語にする。");
B("dem","ユゴーはこのチョコレートケーキが大好きなんだ。","Hugo adore ce gâteau au chocolat !",["cet","cette"],"gâteau は子音で始まる男性名詞 → ce。au chocolat は à＋le。");
B("dem","【キャンパスで】この女子学生はレアの友だちだよ。","Cette étudiante est une amie de Léa.",["cet","ce"],"女性名詞は母音で始まっても cette（cet にしない）。");
B("dem","【奈良公園で】この鹿たち、ゆいのおせんべいを食べてる！","Ces cerfs mangent les biscuits de Yui !",["ce","mange"],"複数 → ces。主語が複数なので動詞も mangent。");
B("dem","この夏、ユゴーが奈良に来る。","Cet été, Hugo arrive à Nara.",["ce","cette"],"été は母音で始まる男性名詞 → cet été（この夏）。");
B("dem","【写真を見て】この男の人、レアのお兄さん？","Cet homme est le frère de Léa ?",["ce","cette"],"homme は無音の h で始まる男性名詞 → cet。");
B("pos","【レアが話す】私の兄のユゴーはリヨンに住んでいる。","Mon frère Hugo habite à Lyon.",["ma","mes"],"frère は男性単数 → mon。");
B("pos","【リヨンで】ユゴーは自分の車がとても気に入っている。","Hugo aime beaucoup sa voiture.",["son","ses"],"voiture は女性名詞 → sa。持ち主（ユゴー）の性は関係ない。");
B("pos","【ゆいとクラスメートについて】彼女たちのフランス語の先生はリヨン出身だ。","Leur professeur de français est de Lyon.",["leurs","ses"],"「彼女たちの」＋単数名詞 → leur（複数名詞なら leurs）。");
B("pos","【ゆいとレアが話す】私たちの寮は大学の近くにある。","Notre résidence est près de l'université.",["nos","du"],"単数 → notre。université は母音で始まる → de l'（du にしない）。");
B("pos","【ゆいがレアに】お兄さんの写真、持ってる？","Tu as une photo de ton frère ?",["ta","a"],"frère は男性 → ton。avoir は tu as。");
</script>
