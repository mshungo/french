<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法練習 — フランス語 練習</title>
<script src="config.js?v=4"></script>
<script src="common.js?v=4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="grammar.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="crown"><div class="eyebrow">Grammaire · Accès</div><h1>文法練習</h1>
    <span class="verbs">教科書『Accès』の Leçon ごとの練習</span></div>
  <div class="panel">
    <div class="acct"><div class="row"><a class="link" href="index.html">← メニュー</a><div class="streak" id="streak"></div></div></div>
    <p class="hello">Leçon を選ぶ<small>教科書の文法項目にそった練習問題です（問題文はこのサイトのオリジナル）。</small></p>
    <div class="lesson-list" id="list"></div>
  </div>
</div>
<script>
(function(){
  var L=[
    {no:1,t:"名詞と冠詞",d:"名詞の性・数／不定・部分・定冠詞／C'est・Il y a・Voici",n:1,c:"#cf8aa0",cw:"#faeef2"},
    {no:2,t:"主語・動詞・限定詞",d:"主語人称代名詞／-er動詞／être・avoir／ce・mon など",n:2,c:"#d6a96f",cw:"#faf2e7"},
    {no:3,t:"形容詞・否定・疑問",d:"形容詞／-ir動詞／否定文・疑問文・答えかた",n:3,c:"#8db79b",cw:"#eef5f0"},
    {no:4,t:"Leçon 4",d:"準備中",soon:true,c:"#92a6cf",cw:"#eef1f8"},
    {no:5,t:"Leçon 5",d:"準備中",soon:true,c:"#b48aa8",cw:"#f6eef3"},
    {no:6,t:"Leçon 6",d:"準備中",soon:true,c:"#c0a06a",cw:"#f8f1e4"}
  ];
  var who=(window.Quiz&&Quiz.user())?Quiz.user().id:"guest";
  var h="";
  L.forEach(function(l){
    var prog="";
    if(!l.soon){try{var s=JSON.parse(localStorage.getItem("gramQuiz_L"+l.no+"_v1_"+who));
      if(s&&s.tries){var m=0;for(var k in s.it){var x=s.it[k];if(x.last===1&&x.c>=2)m++;}
        prog='<span class="sb-prog"><span>'+s.tries+'回 ・ 習得 '+m+'問</span></span>';}}catch(e){}}
    h+=(l.soon?'<div class="start-btn soon"':'<a class="start-btn" href="grammar-l'+l.no+'.html"')+' style="--vc:'+l.c+';--vcw:'+l.cw+'">'+
      '<i class="wk">L'+l.no+'</i><span class="sb-name">'+(l.soon?l.t:"Leçon "+l.no+"　"+l.t)+'<span class="sb-desc">'+l.d+'</span></span>'+prog+
      (l.soon?'</div>':'</a>');
  });
  document.getElementById("list").innerHTML=h;
  if(window.Quiz){var r=Quiz.streak();document.getElementById("streak").innerHTML='連続 '+r.n+'日'+(r.doneToday?' <small>今日済</small>':(r.n>0?' <small>今日はまだ</small>':''));}
})();
</script>
</body>
</html>
