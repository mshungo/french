<script src="config.js?v=4"></script>

<body>
<div class="wrap">
  <div class="crown"><div class="crest"><svg width="30" height="30" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.5c-1.2 5.5-1.3 11.4.8 15.6 2 4 10.4 4 12.4 0 2.1-4.2 2-10.1.8-15.6-3.1 2-10.9 2-14 0z"/><circle cx="12.8" cy="14.6" r="2.7"/><circle cx="19.2" cy="14.6" r="2.7"/><circle cx="12.8" cy="14.6" r=".8" fill="currentColor" stroke="none"/><circle cx="19.2" cy="14.6" r=".8" fill="currentColor" stroke="none"/><path d="M15.2 18.2l.8 1.5.8-1.5"/><path d="M12 23.2c1.3.8 2.7.8 4 0 1.3.8 2.7.8 4 0"/></svg></div>
    <div class="eyebrow">Naralingo · Grammaire</div><h1>文法練習</h1>
    <span class="verbs">教科書『Accès』の Leçon ごとの練習</span></div>
  <div class="panel">
    <div class="acct"><div class="row"><a class="link" href="index.html">← メニュー</a><div class="streak" id="streak"></div></div></div>
    <p class="hello">Leçon を選ぶ<small>教科書の文法項目にそった練習問題です（問題文はこのサイトのオリジナル）。</small></p>
    <div class="lesson-list" id="list"></div>
  </div>
</div>
<script>
/* 1問の達成ポイント（0〜4）。grammar.js と同じ数え方（前の版の記録も換算する） */
function ptOf(x){if(x.pt!=null)return Math.min(4,x.pt);var run=x.run!=null?x.run:(x.last===1?Math.min(x.c,1):0);
  return (!x.wk&&(((x.wrun||0)>=1&&run>=2)||x.m))?4:(!x.wk&&run>=2)?2:((x.c||0)>0&&x.last===1)?1:0;}
(function(){
  if(window.Quiz&&!Quiz.requireLogin())return;
  var L=[
    {no:1,t:"名詞と冠詞",d:"名詞の性・数／不定・部分・定冠詞／C'est・Il y a・Voici",n:108,c:"#cf8aa0",cw:"#faeef2"},
    {no:2,t:"主語・動詞・限定詞",d:"主語人称代名詞／-er動詞／être・avoir／ce・mon など",n:105,c:"#d6a96f",cw:"#faf2e7"},
    {no:3,t:"形容詞・否定・疑問",d:"形容詞／-ir動詞／否定文・疑問文・答えかた",n:97,c:"#8db79b",cw:"#eef5f0"},
    {no:4,t:"疑問詞と近接未来",d:"aller・venir／近接未来・近接過去／疑問代名詞・疑問副詞・quel／時刻と数",n:124,c:"#92a6cf",cw:"#eef1f8"},
    {no:5,t:"補語人称代名詞",d:"faire・partir・sortir／直接・間接目的補語／強勢形／非人称構文・所有代名詞",n:105,c:"#b48aa8",cw:"#f6eef3"},
    {no:6,t:"代名動詞と命令法",d:"lire・écrire・attendre・mettre など／代名動詞／命令法",n:115,c:"#c0a06a",cw:"#f8f1e4"}
  ];
  function fmtDur(ms){var m=Math.round((ms||0)/60000);return m<60?m+"分":Math.floor(m/60)+"時間"+(m%60?(m%60)+"分":"");}
  var who=(window.Quiz&&Quiz.user())?Quiz.user().id:"guest";
  var h="";
  L.forEach(function(l){
    var prog="";
    if(!l.soon){try{var s=JSON.parse(localStorage.getItem("gramQuiz_L"+l.no+"_v1_"+who));
      if(s&&s.tries){var m=0,pts=0;for(var k in s.it){var x=s.it[k],pt=ptOf(x);pts+=pt;if(pt>=4&&!x.wk)m++;}   // 達成ポイント（1問4点）
        var pct=l.n?Math.floor(pts/(l.n*4)*100):0;
        var B=s.badges||{},nb=Object.keys(B).filter(function(k){return k.indexOf("s:")===0;}).length,W=window.Badge;
        var seals=W?(nb?'<span class="bdg-mini">'+W.seal({kind:"sec",on:true,color:l.c,size:14})+'×'+nb+'</span>':'')+
          (B.clear||s.answered>=300?' '+W.seal({kind:"clear",on:true,size:14}):'')+(B.medal||m>=l.n?' '+W.seal({kind:"medal",on:true,size:17}):''):'';
        prog='<span class="sb-prog"><span>'+s.tries+'回 ・ '+fmtDur(s.timeMs)+'</span><span>達成 '+pct+'%'+(seals?' '+seals:'')+'</span></span>';}}catch(e){}}
    h+=(l.soon?'<div class="start-btn soon"':'<a class="start-btn" href="grammar-l'+l.no+'.html"')+' style="--vc:'+l.c+';--vcw:'+l.cw+'">'+
      '<i class="wk">L'+l.no+'</i><span class="sb-name">'+(l.soon?l.t:"Leçon "+l.no+"　"+l.t)+'<span class="sb-desc">'+l.d+'</span></span>'+prog+
      (l.soon?'</div>':'</a>');
  });
  document.getElementById("list").innerHTML=h;
  if(window.Quiz){var r=Quiz.streak();document.getElementById("streak").innerHTML='連続 '+r.n+'日'+(r.doneToday?' <small>今日済</small>':(r.n>0?' <small>今日はまだ</small>':''));}
})();
</script>
</body>
