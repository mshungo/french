<script>
/* ===== Leçon 9：関係代名詞 qui・que・dont・où、比較級と最上級、前置詞つきの関係代名詞、数量の比較（テキスト p.54-59） ===== */
window.LESSON={no:9,title:"関係代名詞・比較",sub:"relatifs・comparatif・superlatif",
  lead:"関係代名詞（qui, que, dont, où）、形容詞・副詞の比較級と最上級、そして En plus… の前置詞つきの関係代名詞と数量の比較を練習します。dormir・sentir・ouvrir・conduire の活用は「動詞活用」のコーナーにあります。",
  sections:[
  {k:"rel1",t:"関係代名詞 qui・que",d:"主語になる qui、直接目的補語になる que（Grammaire 2）",c:"#7fa7c9",ci:"#5c86aa",cw:"#edf3f8",
   memo:'<p>関係代名詞は名詞（先行詞）のすぐあとに置き、その名詞を説明する文（関係節）をつなぐ。</p>'+
   '<p><b>qui</b>：関係節の中で<b>主語</b>になる。先行詞は人でも物でもよい。あとの動詞は先行詞に合わせて活用する。<br><span class="fr">le bus <b>qui</b> va à la gare</span>（駅に行くバス）</p>'+
   '<p><b>que</b>：関係節の中で<b>直接目的補語</b>になる。あとに「主語＋動詞」が続く。<br><span class="fr">le livre <b>que</b> Léa lit</span>（レアが読んでいる本）</p>'+
   '<p>que は母音の前で <b>qu\'</b> になる（<span class="fr">le sac qu\'elle a acheté</span>）。qui は母音の前でも形が変わらない。</p>'+
   '<p>見分け方：空欄のすぐあとが<b>動詞</b>なら qui、<b>主語＋動詞</b>なら que。</p>'},
  {k:"rel2",t:"関係代名詞 dont・où",d:"de を含む dont、場所・時の où（Grammaire 2）",c:"#8db79b",ci:"#6c9a7f",cw:"#eef5f0",
   memo:'<p><b>dont</b>：前置詞 <b>de</b> を含む関係代名詞。「～の」「～について」「～のうちの」。</p>'+
   '<p><span class="fr">une amie <b>dont</b> le père est médecin</span>（← le père <b>de</b> cette amie）<br><span class="fr">le film <b>dont</b> je t\'ai parlé</span>（← parler <b>de</b> ce film）<br><span class="fr">trois chats, <b>dont</b> deux sont noirs</span>（← deux <b>de</b> ces trois chats）</p>'+
   '<p>de をとる表現：<span class="fr">parler de, avoir besoin de, se souvenir de, être fier de, être content de</span> など。</p>'+
   '<p><b>où</b>：先行詞が<b>場所</b>または<b>時</b>。<br><span class="fr">la ville <b>où</b> je suis née</span>（私が生まれた町）　<span class="fr">le jour <b>où</b> nous sommes arrivés</span>（私たちが着いた日）</p>'},
  {k:"mix",t:"関係代名詞の使い分け",d:"qui・que・dont・où を選ぶ／que のあとの過去分詞の一致",c:"#d6a96f",ci:"#b88a4f",cw:"#faf2e7",
   memo:'<p>先行詞が同じでも、関係節の中での役割で決まる：</p>'+
   '<p><span class="fr">la maison <b>qui</b> est près de la gare</span>（主語）<br><span class="fr">la maison <b>que</b> j\'ai achetée</span>（直接目的補語）<br><span class="fr">la maison <b>dont</b> le toit est rouge</span>（de：～の）<br><span class="fr">la maison <b>où</b> j\'ai grandi</span>（場所）</p>'+
   '<p><b>過去分詞の一致</b>：que のあとの動詞が複合過去などのとき、過去分詞は先行詞（＝前に出た直接目的補語）の性と数に一致する。<br><span class="fr">la tarte que Léa a fait<b>e</b>　les photos que j\'ai pris<b>es</b></span></p>'+
   '<p>qui のあとが être をとる動詞なら、過去分詞は先行詞に一致する：<span class="fr">les filles qui sont venu<b>es</b></span></p>'},
  {k:"comp",t:"比較級",d:"plus / moins / aussi ～ que、meilleur・mieux（Grammaire 3）",c:"#cf8aa0",ci:"#b16880",cw:"#faeef2",
   memo:'<table><tr><td>優等比較</td><td class="fr">plus ＋ 形容詞・副詞 ＋ que ～</td><td>～より…</td></tr><tr><td>劣等比較</td><td class="fr">moins ＋ 形容詞・副詞 ＋ que ～</td><td>～ほど…でない</td></tr><tr><td>同等比較</td><td class="fr">aussi ＋ 形容詞・副詞 ＋ que ～</td><td>～と同じくらい…</td></tr></table>'+
   '<p><span class="fr">Hugo est plus grand que Léa.</span>　<span class="fr">Yui marche aussi vite que moi.</span></p>'+
   '<p>形容詞は主語の性と数に一致する（副詞は変わらない）：<span class="fr">Léa est plus grand<b>e</b> que Yui.</span></p>'+
   '<p>que のあとが人称代名詞のときは<b>強勢形</b>（moi, toi, lui, elle, nous, vous, eux, elles）。</p>'+
   '<p>特別な形：<span class="fr">bon → <b>meilleur(e)(s)</b></span>（× plus bon）、<span class="fr">bien → <b>mieux</b></span>（× plus bien）、<span class="fr">mauvais → <b>pire</b></span>（plus mauvais も使う）</p>'},
  {k:"sup",t:"最上級",d:"le / la / les plus (moins) ～ de …、le meilleur・le mieux（Grammaire 3）",c:"#9b8fc4",ci:"#7a6da6",cw:"#f1eff8",
   memo:'<p><b>定冠詞＋plus / moins＋形容詞</b>（＋ de ～）：「（～の中で）いちばん…」。定冠詞は名詞の性と数に合わせる。</p>'+
   '<p><span class="fr">C\'est le quartier <b>le plus</b> calme <b>de</b> la ville.</span>　<span class="fr">Yui est <b>la plus</b> jeune <b>de</b> sa famille.</span></p>'+
   '<p>「～の中で」は <b>de</b>（de＋le → du、de＋les → des）。</p>'+
   '<p>副詞の最上級はいつも <b>le</b>：<span class="fr">C\'est Hugo qui court <b>le plus</b> vite.</span></p>'+
   '<p>特別な形：<span class="fr">bon → <b>le meilleur / la meilleure / les meilleur(e)s</b></span>、<span class="fr">bien → <b>le mieux</b></span></p>'},
  {k:"prel",t:"前置詞つきの関係代名詞",d:"avec qui／sur lequel／auquel・duquel（En plus… 1）",c:"#6fb0ad",ci:"#4c8e8b",cw:"#ebf5f4",
   memo:'<p>先行詞が<b>人</b>：<b>前置詞＋qui</b>　<span class="fr">l\'ami <b>avec qui</b> je voyage</span></p>'+
   '<p>先行詞が<b>物</b>：<b>前置詞＋lequel / laquelle / lesquels / lesquelles</b>（先行詞の性と数に合わせる）<br><span class="fr">la table <b>sur laquelle</b> j\'ai mis mon sac</span></p>'+
   '<p>à・de のあとでは縮約する：</p>'+
   '<table><tr><th></th><th>男性単数</th><th>女性単数</th><th>男性複数</th><th>女性複数</th></tr><tr><td>à ＋</td><td class="fr">auquel</td><td class="fr">à laquelle</td><td class="fr">auxquels</td><td class="fr">auxquelles</td></tr><tr><td>de ＋</td><td class="fr">duquel</td><td class="fr">de laquelle</td><td class="fr">desquels</td><td class="fr">desquelles</td></tr></table>'+
   '<p><span class="fr">le cours <b>auquel</b> j\'assiste</span>（assister à）　<span class="fr">le parc <b>près duquel</b> j\'habite</span>（près de）</p>'+
   '<p>près de, en face de, à côté de のように de で終わる前置詞句のあとは、dont ではなく duquel などを使う。</p>'},
  {k:"qty",t:"数量の比較",d:"plus de / moins de / autant de ＋名詞（En plus… 2）",c:"#c99b6a",ci:"#a57a48",cw:"#f9f1e8",
   memo:'<table><tr><td class="fr">plus de ＋名詞＋ que ～</td><td>～より多くの…</td></tr><tr><td class="fr">moins de ＋名詞＋ que ～</td><td>～より少ない…</td></tr><tr><td class="fr">autant de ＋名詞＋ que ～</td><td>～と同じくらいの…</td></tr></table>'+
   '<p><span class="fr">J\'ai plus de livres que toi.</span>　<span class="fr">Hugo a moins de temps que moi.</span></p>'+
   '<p>名詞の前は冠詞なしの <b>de</b>（母音の前で d\'）。同等は aussi ではなく <b>autant</b>。</p>'+
   '<p>2つの名詞を比べるとき、que のあとにも de：<span class="fr">Il y a autant de filles que <b>de</b> garçons.</span></p>'+
   '<p>最上級：<b>le plus de / le moins de</b> ＋名詞：<span class="fr">C\'est Léa qui a le plus de livres.</span></p>'}
]};

/* ---------- 関係代名詞 qui・que ---------- */
FROM(9,0);
C("rel1","Tu connais la fille ___ parle avec Hugo ?","qui",["qui","que","dont"],"あとが動詞（parle）→ 関係節の主語になる qui。",{ja:"ユゴーと話している女の子を知ってる？"});
C("rel1","Le livre ___ Léa lit est très intéressant.","que",["que","qui","où"],"あとが「主語＋動詞」（Léa lit）→ 直接目的補語になる que。",{ja:"レアが読んでいる本はとてもおもしろい。"});
C("rel1","Voilà le bus ___ va à la gare.","qui",["qui","que","où"],"あとが動詞（va）→ 主語の qui。物にも qui を使う。",{ja:"あれが駅に行くバスです。"});
C("rel1","C'est un film ___ j'aime beaucoup.","que",["que","qui","dont"],"j'aime の直接目的補語 → que。",{ja:"それは私が大好きな映画です。"});
C("rel1","La dame ___ habite à côté est très gentille.","qui",["qui","que","dont"],"habite の主語 → qui。",{ja:"となりに住んでいる女の人はとても親切だ。"});
C("rel1","Le gâteau ___ Yui a fait est délicieux.","que",["que","qui","où"],"Yui a fait の直接目的補語 → que。",{ja:"ゆいが作ったケーキはおいしい。"});
C("rel1","J'ai un ami ___ parle cinq langues.","qui",["qui","que","où"],"parle の主語 → qui。",{ja:"5か国語を話す友だちがいる。"});
C("rel1","C'est la chanson ___ Hugo chante souvent.","que",["que","qui","dont"],"Hugo chante の直接目的補語 → que。",{ja:"これはユゴーがよく歌う歌だ。"});
C("rel1","Voilà le sac ___ elle a acheté hier.","qu'",["qu'","que","qui"],"elle a acheté の直接目的補語 → que。母音の前なので qu'。",{ja:"これが彼女が昨日買ったかばんです。"});
C("rel1","La fille ___ a téléphoné s'appelle Emma.","qui",["qui","qu'","que"],"a téléphoné の主語 → qui。qui は母音の前でも qu' にならない。",{ja:"電話してきた女の子はエマという名前だ。"});
C("rel1","Les étudiants ___ arrivent en retard doivent attendre.","qui",["qui","que","dont"],"arrivent の主語 → qui。動詞は先行詞（les étudiants）に合わせて複数。",{ja:"遅れて来る学生は待たなければならない。"});
C("rel1","C'est moi qui ___ la plus jeune.（être）","suis",["suis","est","es"],"qui のあとの動詞は先行詞（moi）に合わせる：je suis。",{ja:"いちばん年下なのは私です。"});
C("rel1","Ce sont mes parents qui ___ la cuisine.（faire）","font",["font","fait","faisons"],"先行詞 mes parents（3人称複数）→ font。",{ja:"料理をするのは両親です。"});
C("rel1","C'est toi qui ___ raison.（avoir）","as",["as","a","ai"],"先行詞 toi → tu as。",{ja:"正しいのはきみだ。"});
T("rel1","関係代名詞を使って1文に","J'ai un chat. Il dort beaucoup.",["J'ai un chat qui dort beaucoup."],"il（主語）を qui に変えて、un chat のすぐあとにつなぐ。",{extra:["que","dont"]});
T("rel1","関係代名詞を使って1文に","Voilà le roman. Yui lit ce roman.",["Voilà le roman que Yui lit."],"ce roman（直接目的補語）を que に変える。",{extra:["qui","où"]});
T("rel1","関係代名詞を使って1文に","Je connais un restaurant. Il ouvre à midi.",["Je connais un restaurant qui ouvre à midi."],"il（主語）→ qui。",{extra:["que","où"]});
T("rel1","関係代名詞を使って1文に","C'est le professeur. Nous aimons beaucoup ce professeur.",["C'est le professeur que nous aimons beaucoup."],"ce professeur（直接目的補語）→ que。",{extra:["qui","dont"]});
B("rel1","これはレアが私にくれた本です。","C'est le livre que Léa m'a donné.",["qui","dont"],"Léa m'a donné の直接目的補語 → que。");
B("rel1","駅に行くバスはここに止まる。","Le bus qui va à la gare s'arrête ici.",["que","où"],"va の主語 → qui。");
B("rel1","窓のそばにいる男の子はユゴーの弟だ。","Le garçon qui est près de la fenêtre est le frère de Hugo.",["que","dont"],"est près de la fenêtre の主語 → qui。");

/* ---------- 関係代名詞 dont・où ---------- */
C("rel2","J'ai une amie ___ le père est médecin.","dont",["dont","que","où"],"le père de cette amie（～の）→ de を含む dont。",{ja:"お父さんが医者の友だちがいる。"});
C("rel2","C'est le film ___ je t'ai parlé.","dont",["dont","que","qui"],"parler de ～（～について話す）→ dont。",{ja:"これがきみに話した映画だよ。"});
C("rel2","Voilà le dictionnaire ___ j'ai besoin.","dont",["dont","que","où"],"avoir besoin de ～（～が必要だ）→ dont。",{ja:"これが私の必要な辞書です。"});
C("rel2","C'est la ville ___ je suis née.","où",["où","que","dont"],"先行詞が場所（la ville）で、「そこで生まれた」→ où。",{ja:"これが私の生まれた町です。"});
C("rel2","Je me souviens du jour ___ nous sommes arrivés à Nara.","où",["où","que","dont"],"先行詞が時（le jour）→ où。",{ja:"奈良に着いた日のことを覚えている。"});
C("rel2","C'est le café ___ nous déjeunons souvent.","où",["où","que","qui"],"場所（le café）で「そこで昼食をとる」→ où。",{ja:"ここは私たちがよく昼食をとるカフェだ。"});
C("rel2","Yui a trois chats, ___ deux sont noirs.","dont",["dont","que","où"],"deux de ces trois chats（～のうちの）→ dont。",{ja:"ゆいは猫を3匹飼っていて、そのうち2匹は黒い。"});
C("rel2","C'est un voyage ___ je me souviens bien.","dont",["dont","que","où"],"se souvenir de ～（～を覚えている）→ dont。",{ja:"それは私がよく覚えている旅行だ。"});
C("rel2","Nara est une ville ___ il y a beaucoup de cerfs.","où",["où","qui","dont"],"場所（une ville）で「そこに～がいる」→ où。",{ja:"奈良はシカがたくさんいる町だ。"});
C("rel2","C'est une chanteuse ___ tout le monde connaît le nom.","dont",["dont","que","qui"],"le nom de cette chanteuse（～の名前）→ dont。",{ja:"だれもが名前を知っている歌手だ。"});
C("rel2","Le quartier ___ Léa travaille est calme.","où",["où","que","dont"],"場所（le quartier）で「そこで働いている」→ où。",{ja:"レアが働いている地区は静かだ。"});
C("rel2","C'est le professeur ___ les cours sont intéressants.","dont",["dont","que","où"],"les cours de ce professeur（～の授業）→ dont。",{ja:"授業がおもしろい先生だ。"});
C("rel2","L'année ___ je suis entrée à l'université, il a beaucoup neigé.","où",["où","que","dont"],"先行詞が時（l'année）→ où。",{ja:"私が大学に入った年は、雪がたくさん降った。"});
C("rel2","C'est un travail ___ je suis fière.","dont",["dont","que","où"],"être fier de ～（～を誇りに思う）→ dont。",{ja:"それは私が誇りに思っている仕事だ。"});
T("rel2","関係代名詞を使って1文に","C'est un écrivain. Les romans de cet écrivain sont célèbres.",["C'est un écrivain dont les romans sont célèbres."],"de cet écrivain → dont。dont のあとは「主語＋動詞」の順。",{extra:["que","où"]});
T("rel2","関係代名詞を使って1文に","Voilà le parc. Nous jouions dans ce parc.",["Voilà le parc où nous jouions."],"dans ce parc（場所）→ où。",{extra:["que","dont"]});
T("rel2","関係代名詞を使って1文に","J'ai acheté le livre. Tu m'as parlé de ce livre.",["J'ai acheté le livre dont tu m'as parlé."],"parler de ce livre → dont。",{extra:["que","où"]});
T("rel2","関係代名詞を使って1文に","C'est le village. Ma mère a grandi dans ce village.",["C'est le village où ma mère a grandi."],"dans ce village（場所）→ où。",{extra:["que","dont"]});
B("rel2","これが私の必要としている辞書です。","Voilà le dictionnaire dont j'ai besoin.",["que","où"],"avoir besoin de → dont。");
B("rel2","ここは私たちが出会ったカフェです。","C'est le café où nous nous sommes rencontrés.",["que","dont"],"場所 → où。");

/* ---------- 関係代名詞の使い分け ---------- */
C("mix","C'est la maison ___ est près de la gare.","qui",["qui","que","où"],"est の主語 → qui。",{ja:"これが駅の近くにある家です。"});
C("mix","C'est la maison ___ j'ai achetée.","que",["que","où","dont"],"j'ai achetée の直接目的補語 → que（「家を買った」）。",{ja:"これが私の買った家です。"});
C("mix","C'est la maison ___ j'ai grandi.","où",["où","que","qui"],"「その家で育った」＝場所 → où。",{ja:"これが私の育った家です。"});
