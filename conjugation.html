<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動詞活用 — Naralingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%239a7b45%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M11.5%209.5C9.6%207.3%209.2%205.1%2010%202.8M10.2%205.9%207.4%204.6M12.6%209.2c-.6-1.8-.1-3.4%201-4.6%22/%3E%3Cpath%20d%3D%22M20.5%209.5c1.9-2.2%202.3-4.4%201.5-6.7M21.8%205.9l2.8-1.3M19.4%209.2c.6-1.8.1-3.4-1-4.6%22/%3E%3Cpath%20d%3D%22M11.4%2011.6%206.6%2010.4c.9%201.9%202.6%203%204.9%203.1%22/%3E%3Cpath%20d%3D%22M20.6%2011.6l4.8-1.2c-.9%201.9-2.6%203-4.9%203.1%22/%3E%3Cpath%20d%3D%22M11.3%2011.2c.3-1.4%202.2-2.1%204.7-2.1s4.4.7%204.7%202.1l-1.1%208.2c-.5%203.6-1.9%206.4-3.6%206.4s-3.1-2.8-3.6-6.4z%22/%3E%3Ccircle%20cx%3D%2213.9%22%20cy%3D%2214.8%22%20r%3D%22.7%22%20fill%3D%22%239a7b45%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%2218.1%22%20cy%3D%2214.8%22%20r%3D%22.7%22%20fill%3D%22%239a7b45%22%20stroke%3D%22none%22/%3E%3Cpath%20d%3D%22M15%2024.3h2%22/%3E%3C/svg%3E">
<script src="config.js?v=4"></script>
<script src="common.js?v=17"></script>
<script src="feedback.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 淡く温かな紙とインク。彩度をおさえた上品なトーン */
    --bg:#f6efe9;                                  /* 生成り */
    --bg-2:#efe6df;
    --card:#fffdfb; --card-edge:#efe6dd;
    --ink:#4a4048; --ink-soft:#8c8088; --ink-faint:#b6acb1;
    --rule:#ece1da;
    --gold:#c0a06a;                                /* やわらかい金 */
    --accent:#b48aa8;                              /* 既定アクセント(藤鼠) */
    --accent-ink:#8f667f;
    --accent-wash:#f6eef3;
    --good:#7a9b86; --good-ink:#5d7d69; --good-wash:#eef4ef;
    --bad:#c98a86;  --bad-ink:#b16a66; --bad-wash:#f8eeed;
    --shadow:rgba(150,120,135,.22);
  }
  /* 動詞ごとのアクセント（やさしい色相） */
  body[data-verb="être"]  {--accent:#cf8aa0;--accent-ink:#b16880;--accent-wash:#faeef2;}
  body[data-verb="aller"] {--accent:#d6a96f;--accent-ink:#b88a4f;--accent-wash:#faf2e7;}
  body[data-verb="avoir"] {--accent:#8db79b;--accent-ink:#6c9a7f;--accent-wash:#eef5f0;}
  body[data-verb="faire"] {--accent:#92a6cf;--accent-ink:#7186b4;--accent-wash:#eef1f8;}
  body[data-verb="mix"]   {--accent:#b48aa8;--accent-ink:#8f667f;--accent-wash:#f6eef3;}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans JP",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); min-height:100vh;
    background:
      radial-gradient(900px 480px at 88% -8%, rgba(207,138,160,.16), transparent 60%),
      radial-gradient(820px 520px at 5% 108%, rgba(146,166,207,.14), transparent 58%),
      radial-gradient(700px 400px at 50% 50%, rgba(214,169,111,.05), transparent 70%),
      linear-gradient(170deg, var(--bg), var(--bg-2));
    background-attachment:fixed;
    display:flex; justify-content:center; padding:42px 18px 76px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:530px;}

  /* ===== title ===== */
  .crown{margin-bottom:24px;text-align:center;}
  .eyebrow{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .crown h1{
    font-family:var(--serif);font-weight:600;margin:0;
    font-size:42px;line-height:1.04;letter-spacing:.5px;color:#5a4e57;
  }
  .crown .verbs{display:inline-block;font-size:12px;color:var(--ink-soft);margin-top:12px;letter-spacing:1.5px;}
  .crown .verbs i{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--accent-ink);}
  .crown .verbs::before,.crown .verbs::after{content:"❦";color:var(--gold);opacity:.55;margin:0 12px;font-size:11px;vertical-align:middle;}

  /* ===== card ===== */
  .panel{
    background:var(--card);
    border:1px solid var(--card-edge);border-radius:26px;
    box-shadow:0 30px 70px -34px var(--shadow), 0 1px 0 rgba(255,255,255,.8) inset;
    padding:34px 30px;position:relative;
  }

  /* ===== HOME ===== */
  .hello{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .hello small{display:block;font-family:"Noto Sans JP";font-size:12.5px;color:var(--ink-soft);margin-top:8px;letter-spacing:.3px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:24px 0 6px;
    border:1px solid var(--rule);border-radius:18px;overflow:hidden;background:#fdf9f6;}
  .stat{padding:16px 8px;text-align:center;position:relative;}
  .stat+.stat{border-left:1px solid var(--rule);}
  .stat .n{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1;color:var(--ink);}
  .stat.acc .n{color:var(--gold);}
  .stat .l{font-size:9.5px;color:var(--ink-faint);letter-spacing:1px;margin-top:6px;}
  .stat .ico{display:none;}
  @media(max-width:430px){.stat .n{font-size:24px;}}

  /* ランク色（共通） */
  .r-SSS{--rk-c:#b8860b;--rk-bg:linear-gradient(135deg,#fff4cf,#ffe9a8);}
  .r-SS {--rk-c:#a06a2c;--rk-bg:linear-gradient(135deg,#fbeecf,#f3dca6);}
  .r-S  {--rk-c:#8a6d3b;--rk-bg:linear-gradient(135deg,#f3ecd8,#e9dcbb);}
  .r-A  {--rk-c:#6c9a7f;--rk-bg:linear-gradient(135deg,#e9f4ee,#d6ecdd);}
  .r-B  {--rk-c:#7186b4;--rk-bg:linear-gradient(135deg,#eaeff8,#d9e2f4);}
  .r-C  {--rk-c:#a08a90;--rk-bg:linear-gradient(135deg,#f2ecef,#e6dbe0);}
  .r-none{--rk-c:var(--ink-faint);--rk-bg:#f3ede9;}

  /* セクションボタン内のクリアタイム＋ランク */
  .sb-time{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;}
  .sb-time .sb-t{font-family:var(--serif);font-size:15px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;}
  .sb-time .sb-rank{min-width:34px;text-align:center;font-family:var(--serif);font-weight:700;
    font-size:14px;padding:2px 0;border-radius:7px;color:var(--rk-c);background:var(--rk-bg);letter-spacing:.5px;}
  .sb-time .sb-none{font-size:11px;color:var(--ink-faint);letter-spacing:.5px;}

  /* 結果画面のランクバッジ */
  .rank-badge{display:none;}
  .mode-btn.mp .mp-lv{display:block;margin-top:3px;font-style:normal;font-size:10.5px;color:var(--ink-faint);letter-spacing:.3px;}
  .mode-btn.mp .mp-goal{color:var(--accent-ink);font-weight:500;}
  .nudge{margin:14px auto 4px;max-width:440px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff8ec,#fdf0f4);border:1px solid #f0dcc0;text-align:left;}
  .nudge .nd-t{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:4px;}
  .nudge .nd-d{font-size:12.5px;line-height:1.75;color:var(--ink-soft);}
  .nudge .nd-d b{color:var(--accent-ink);}
  .nudge .nd-go{margin-top:10px;width:100%;}
  .rank-badge.show{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:96px;height:96px;border-radius:50%;margin:8px auto 4px;color:var(--rk-c);background:var(--rk-bg);
    box-shadow:0 8px 22px -12px var(--shadow), 0 0 0 1px rgba(0,0,0,.04) inset;}
  .rank-badge .rk{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;}
  .rank-badge .rk-sub{font-size:9px;letter-spacing:3px;margin-top:3px;opacity:.7;}

  .mode-row{display:flex;align-items:center;justify-content:space-between;margin:26px 0 4px;}
  .mode-label{font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;text-transform:uppercase;}
  .mode-toggle{display:inline-flex;border:1px solid var(--rule);border-radius:30px;overflow:hidden;background:#f5ede7;padding:3px;gap:2px;}
  .mode-btn{font-family:"Noto Sans JP";font-size:12.5px;padding:7px 18px;cursor:pointer;
    background:transparent;border:none;color:var(--ink-soft);transition:all .2s;border-radius:30px;}
  .mode-btn.on{background:var(--card);color:var(--accent-ink);box-shadow:0 2px 6px -2px var(--shadow);}

  /* タイムアタック スイッチ */
  .switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{position:relative;width:44px;height:24px;border-radius:30px;background:#ddd3ca;
    transition:background .2s;flex:none;}
  .switch-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;}
  .switch input:checked + .switch-track{background:var(--accent);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(20px);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--accent-ink);outline-offset:2px;}
  .switch-text{font-size:12px;color:var(--ink-soft);letter-spacing:.5px;min-width:56px;}
  body.no-ta .sb-time{opacity:.35;}

  .section-label{font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;text-transform:uppercase;
    margin:26px 0 14px;display:flex;align-items:center;gap:14px;}
  .section-label::before,.section-label::after{content:"";flex:1;height:1px;background:var(--rule);}

  .sections{display:grid;grid-template-columns:1fr;gap:11px;}
  .start-btn{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;
    background:#fdfaf8;border:1px solid var(--rule);border-radius:18px;padding:14px 18px;
    font-family:"Noto Sans JP";position:relative;overflow:hidden;
    transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .18s,border-color .18s,background .18s;}
  .start-btn[data-verb="être"] {--vc:#cf8aa0;--vcw:#faeef2;}
  .start-btn[data-verb="aller"]{--vc:#d6a96f;--vcw:#faf2e7;}
  .start-btn[data-verb="avoir"]{--vc:#8db79b;--vcw:#eef5f0;}
  .start-btn[data-verb="faire"]{--vc:#92a6cf;--vcw:#eef1f8;}
  /* 動詞色の小さな円バッジ */
  .start-btn i{font-family:var(--serif);font-style:italic;font-size:22px;
    color:var(--vc,var(--gold));line-height:1;width:44px;height:44px;border-radius:50%;
    background:var(--vcw,#f4ede6);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .18s;}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -16px var(--shadow);border-color:var(--vc,var(--gold));background:#fff;}
  .start-btn:hover i{transform:scale(1.08) rotate(-3deg);}
  .start-btn:active{transform:translateY(0);}
  .start-btn:focus-visible{outline:2px solid var(--vc,var(--gold));outline-offset:3px;}
  .start-btn .sb-name{font-size:13px;color:var(--ink);}
  .start-btn.summary{width:100%;margin-top:6px;background:linear-gradient(135deg,#fdf6f0,#f8eef4);}
  .start-btn.summary i{font-style:normal;color:var(--gold);font-family:"Noto Sans JP";font-size:17px;background:#fff;}
  .start-btn.summary:hover{border-color:var(--gold);}

  .mini-reset{display:block;margin:22px auto 0;background:none;border:none;cursor:pointer;
    color:var(--ink-faint);font-family:"Noto Sans JP";font-size:11.5px;letter-spacing:1px;text-decoration:underline;text-underline-offset:3px;}
  .mini-reset:hover{color:var(--bad-ink);}

  /* ===== QUIZ ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .back{background:#fdfaf8;border:1px solid var(--rule);border-radius:50%;width:40px;height:40px;
    cursor:pointer;font-size:17px;color:var(--ink-soft);line-height:1;transition:background .15s,transform .12s;}
  .back:hover{background:var(--accent-wash);transform:translateX(-2px);}
  .hearts{display:flex;gap:8px;}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block;transition:transform .25s,background .25s,box-shadow .25s;}
  .pdot.d-ok{background:var(--good);}
  .pdot.d-no{background:var(--bad);}
  .pdot.d-now{background:var(--accent);transform:scale(1.5);box-shadow:0 0 0 4px var(--accent-wash);}
  .qcount{font-family:var(--serif);font-size:19px;color:var(--ink-soft);font-style:italic;}
  .live-timer{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--accent-ink);
    font-variant-numeric:tabular-nums;min-width:80px;text-align:center;}

  .round-label{font-size:10.5px;color:var(--accent-ink);letter-spacing:2.5px;text-transform:uppercase;
    margin-bottom:14px;text-align:center;font-weight:500;}
  .bar{height:5px;background:var(--rule);border-radius:5px;overflow:hidden;margin-bottom:28px;}
  .bar .fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s cubic-bezier(.4,1.2,.5,1);}

  .verb-chip{display:inline-block;font-family:var(--serif);font-style:italic;font-weight:600;
    color:var(--accent-ink);background:var(--accent-wash);padding:5px 20px;border-radius:30px;font-size:19px;}
  .prompt{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.45;margin:18px 0 4px;color:var(--ink);}
  .blank{display:inline-block;min-width:50px;text-align:center;color:var(--accent-ink);font-weight:600;
    border-bottom:2px dotted var(--accent);}
  .jp{font-size:13px;color:var(--ink-soft);margin:4px 0 28px;letter-spacing:.3px;}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  @media(max-width:430px){.opts{grid-template-columns:1fr;}}
  .opt{
    font-family:var(--serif);font-size:24px;font-weight:600;cursor:pointer;
    padding:16px 10px;border-radius:16px;text-align:center;color:var(--ink);
    background:#fdfaf8;border:1px solid var(--rule);position:relative;
    transition:background .14s,border-color .14s,transform .08s,box-shadow .14s;}
  .opt:hover{background:#fff;border-color:var(--accent);box-shadow:0 8px 18px -12px var(--shadow);transform:translateY(-1px);}
  .opt:active{transform:translateY(0);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt.correct{background:var(--good-wash);border-color:var(--good);color:var(--good-ink);}
  .opt.wrong{background:var(--bad-wash);border-color:var(--bad);color:var(--bad-ink);}
  .opt.dim{opacity:.38;}
  .opt[disabled]{cursor:default;}

  .write-box{display:flex;gap:12px;}
  .write-input{flex:1;font-family:var(--serif);font-size:25px;font-weight:600;padding:14px 18px;
    border:1px solid var(--rule);border-radius:16px;color:var(--ink);background:#fdfaf8;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;}
  .write-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-wash);background:#fff;}
  .write-input.ok{border-color:var(--good);background:var(--good-wash);color:var(--good-ink);}
  .write-input.no{border-color:var(--bad);background:var(--bad-wash);color:var(--bad-ink);}
  .write-btn{font-family:"Noto Sans JP";font-size:14px;color:#fff;background:var(--accent-ink);
    border:none;border-radius:16px;padding:0 26px;cursor:pointer;transition:background .15s;}
  .write-btn:hover{background:var(--accent);}
  .write-btn:disabled{opacity:.5;cursor:default;}

  .fb{text-align:center;min-height:24px;margin-top:22px;font-family:var(--serif);
    font-style:italic;font-size:19px;opacity:0;transition:opacity .15s;}
  .fb.show{opacity:1;}
  .fb.ok{color:var(--good-ink);}
  .fb.no{color:var(--bad-ink);}
  .fb .full{font-weight:600;font-style:normal;color:var(--ink);}
  .hint{text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:12px;letter-spacing:.5px;}

  /* ===== RESULT ===== */
  .result{text-align:center;}
  .result .face{font-family:var(--serif);font-size:42px;line-height:1;margin-bottom:8px;color:var(--gold);}
  .result h2{font-size:10.5px;letter-spacing:3px;color:var(--ink-faint);margin:0 0 16px;font-weight:500;text-transform:uppercase;}
  .ring{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1;color:var(--ink);}
  .ring small{font-size:26px;color:var(--ink-faint);font-style:italic;}
  .pct-pill{display:inline-block;margin-top:14px;background:var(--accent-wash);color:var(--accent-ink);
    padding:7px 24px;border-radius:30px;font-size:15px;font-weight:500;}
  .msg{font-family:var(--serif);font-style:italic;font-size:20px;margin:22px 0 8px;color:var(--ink);}
  .rtime{font-size:13.5px;color:var(--ink-soft);margin:2px 0 4px;letter-spacing:.3px;}
  .rtime .rec{color:var(--accent-ink);font-weight:700;letter-spacing:.5px;}
  .rtime .best{color:var(--ink-faint);font-size:12px;}
  .review{text-align:left;background:#fbf5f1;border:1px solid var(--rule);border-radius:16px;
    padding:18px 20px;margin-top:20px;}
  .review .ttl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px;}
  .rrow{font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--rule);display:flex;
    justify-content:space-between;gap:10px;align-items:center;}
  .rrow:last-child{border-bottom:none;}
  .rrow .miss{color:var(--bad-ink);text-decoration:line-through;font-family:var(--serif);font-size:18px;font-weight:600;}
  .rrow .got{color:var(--good-ink);font-family:var(--serif);font-size:18px;font-weight:600;}
  .rrow .ar{color:var(--ink-faint);}
  .again{margin-top:24px;}
  .play{display:block;width:100%;cursor:pointer;border:none;font-family:"Noto Sans JP";font-weight:500;
    font-size:14.5px;color:#fff;letter-spacing:3px;padding:16px;border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-ink));
    box-shadow:0 12px 24px -14px var(--accent-ink);transition:transform .1s,box-shadow .1s,filter .15s;}
  .play:hover{filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 16px 28px -14px var(--accent-ink);}
  .play:active{transform:translateY(0);}
  .play:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;}
  .play .spark{display:none;}
  .home-link{display:block;margin:16px auto 0;background:none;border:none;cursor:pointer;
    color:var(--ink-faint);font-family:"Noto Sans JP";font-size:12px;letter-spacing:1px;text-decoration:underline;text-underline-offset:3px;}
  .home-link:hover{color:var(--accent-ink);}
  .hidden{display:none;}
  .acct{margin:0 0 16px;padding:12px 14px;border:1px solid rgba(60,40,40,.12);border-radius:14px;background:rgba(255,255,255,.55);
    font-family:"Noto Sans JP";font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .acct .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .acct .who{font-weight:500;color:var(--ink);word-break:break-all;}
  .acct .streak{font-weight:500;color:var(--accent-ink);white-space:nowrap;}
  .acct .streak small{font-weight:400;color:var(--ink-faint);}
  .acct .note{margin-top:6px;color:var(--ink-faint);font-size:11.5px;}
  .acct .warn{color:#a2453f;}
  .acct .idrow{display:flex;gap:8px;margin-top:8px;}
  .acct .idin{flex:1;min-width:0;padding:9px 12px;border:1px solid rgba(60,40,40,.2);border-radius:10px;background:#fff;

let store=load(storeKey);
function load(key){
  try{const r=JSON.parse(localStorage.getItem(key));if(r&&typeof r.tries==="number"){
    if(!Array.isArray(r.days))r.days=[];                   // 学習した日（JST, yyyy-mm-dd）
    if(!r.bestTimes)r.bestTimes={};                       // セクション別ベストタイム
    SECTIONS.forEach(s=>{if(typeof r.bestTimes[s]==="undefined")r.bestTimes[s]=null;});
    return r;
  }}catch(e){}
  // 旧v3データからの移行（単一bestTimeがあれば総まとめに引き継ぐ）
  let migrated={};SECTIONS.forEach(s=>migrated[s]=null);
  if(key===KEY){try{const old=JSON.parse(localStorage.getItem("conjQuizStats_v3"));
    if(old&&typeof old.bestTime==="number")migrated.mix=old.bestTime;}catch(e){}}

}

function fmtTime(ms){
  if(ms==null)return "—";
  const s=ms/1000;
  const m=Math.floor(s/60), sec=s-m*60;
  return m>0 ? (m+"分"+sec.toFixed(1)+"秒") : (sec.toFixed(1)+"秒");
}
/* クリアタイム(ms)→ランク。全問正解タイムのみ対象。 */
function rankOf(ms){
  if(ms==null)return null;
  const s=ms/1000;
  if(s<=20)return "SSS";
  if(s<=30)return "SS";
  if(s<=45)return "S";
  if(s<=60)return "A";
  if(s<=120)return "B";
  return "C";
}

/* ===== util ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clean(a){return [...new Set(a.filter(x=>x&&x.length))];}

/* ===== 出題 =====
   verb + テンプレート tpl + 主語トークン subTok から1問を組む。
   選択肢 = 正解1 + 紛らわしい誤答1〜2 + 他人称の実在活用1〜2 */
function buildOptions(verb, tpl, subTok){
  const sub=SUBJ[subTok];
  const key=sub.key;                       // 活用キー（avoirは il/elle 等。jeは "j'" を別扱い）
  const conjKey = (verb==="avoir" && key==="je") ? "j'" : key;
  const answer=VERBS[verb].forms[conjKey];

  const otherPersons=clean(Object.values(VERBS[verb].forms).filter(x=>x!==answer));
  const nearPool=clean((VERBS[verb].near[conjKey]||[]).filter(x=>x!==answer && !otherPersons.includes(x)));

  let nNear = Math.random()<0.5?1:2;
  nNear = Math.min(nNear, nearPool.length);
  let nOther = 3 - nNear;
  nOther = Math.min(nOther, otherPersons.length);
  let deficit = 3 - (nNear+nOther);
  if(deficit>0){ nNear=Math.min(nearPool.length, nNear+deficit); }

  let distract=[
    ...shuffle(nearPool.slice()).slice(0,nNear),
    ...shuffle(otherPersons.slice()).slice(0,nOther)
  ];
  distract=clean(distract);
  if(distract.length<3){
    const backup=shuffle(clean([...nearPool,...otherPersons]).filter(x=>!distract.includes(x)&&x!==answer));
    for(const b of backup){if(distract.length>=3)break;distract.push(b);}
  }
  distract=distract.slice(0,3);

  // 表示用：エリジオンの有無は実際の活用(answer)で判定する
  const elide = (sub.disp==="Je" && /^[aeiouéèêhàâ]/i.test(answer));
  const sentence = elide ? ("J'<BLANK>"+tpl.pred) : (sub.disp+" <BLANK>"+tpl.pred);
  const full     = elide ? ("J'"+answer+tpl.pred) : (sub.disp+" "+answer+tpl.pred);
  const jp = sub.jp + tpl.jp;
  return {verb, subject:subTok, sentence, full, jp, answer,
          options:shuffle([answer,...distract])};
}

/* ラウンドを「重複なし」＋「人称（活用形）が均等に分散」するよう構築。
   手順:
   1) 文型（動詞,テンプレート）を重複なしで ROUND 個選ぶ。
   2) 各文型に主語を割り当てる。activationキー(je/tu/il-elle/nous/vous/ils-elles)の
      使用回数が最小のものを優先して選び、偏りを防ぐ。
   3) 選択肢の少ない（＝主語の自由度が低い）文型から先に割り当て、実現可能性を上げる。 */
function conjKeyOf(verb, subTok){
  const key=SUBJ[subTok].key;
  return (verb==="avoir" && key==="je") ? "j'" : key;
}
function buildRound(verbFilter){
  const verbs = verbFilter ? [verbFilter] : VERB_KEYS;
  // 1) 文型候補を集めてシャッフル、重複なしで ROUND 個
  let templates=[];
  verbs.forEach(v=>{ SENT[v].forEach((tpl,ti)=>templates.push({verb:v,tplIndex:ti,tpl})); });
  shuffle(templates);
  let picked=[];const seen=new Set();
  for(const t of templates){
    const k=t.verb+"|"+t.tplIndex;
    if(seen.has(k))continue;
    seen.add(k);picked.push(t);
    if(picked.length>=ROUND)break;
  }
  // 2) 主語の自由度が低い順（選べる主語が少ない文型）から割り当てる
  picked.sort((a,b)=>a.tpl.subs.length-b.tpl.subs.length);
  const useCount={};                       // activationキーごとの使用回数
  const assigned=picked.map(t=>{
    // この文型で選べる主語を、activationキーの使用回数が少ない順に評価
    const cands=shuffle(t.tpl.subs.slice());
    let best=cands[0], bestC=Infinity;
    for(const subTok of cands){
      const ck=conjKeyOf(t.verb,subTok);
      const c=useCount[ck]||0;
      if(c<bestC){bestC=c;best=subTok;}
    }
    const ck=conjKeyOf(t.verb,best);
    useCount[ck]=(useCount[ck]||0)+1;
    return {verb:t.verb, tpl:t.tpl, subTok:best};
  });
  shuffle(assigned);                       // 出題順はランダムに戻す
  return assigned.map(c=>buildOptions(c.verb,c.tpl,c.subTok));
}

/* ===== sound ===== */
let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,start,dur,type,vol){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g).connect(actx.destination);o.start(start);o.stop(start+dur+0.02);
}
function playCorrect(){ // 上昇する短い和音
  if(!actx)return;const t=actx.currentTime;
  [659.25,783.99,987.77,1318.51].forEach((f,i)=>tone(f,t+i*0.07,0.26,"triangle",0.2));
}
function playWrong(){
  if(!actx)return;const t=actx.currentTime;
  tone(330,t,0.16,"sine",0.14);tone(247,t+0.12,0.2,"sine",0.14);
}
function playStart(){if(!actx)return;const t=actx.currentTime;tone(523.25,t,0.12,"triangle",0.15);tone(784,t+0.09,0.16,"triangle",0.15);}
function playFanfare(){ // 全問正解クリア用の短いファンファーレ
  if(!actx)return;const t=actx.currentTime;
  // 旋律: ソ ソ ソ ド↑ — ド↑ ソ ド↑(伸ばし)
  const mel=[
    [783.99,0.00,0.14],[783.99,0.15,0.14],[783.99,0.30,0.14],[1046.50,0.45,0.30],
    [1046.50,0.82,0.16],[783.99,1.00,0.16],[1046.50,1.18,0.55]
  ];
  mel.forEach(([f,d,dur])=>{
    tone(f,t+d,dur,"triangle",0.2);
    tone(f/2,t+d,dur,"sine",0.07); // 1oct下を薄く重ねて厚みを出す
  });
  // 最後に明るい和音（ド・ミ・ソ・ド）
  const ch=t+1.18;
  [523.25,659.25,783.99,1046.50].forEach((f,i)=>tone(f,ch+i*0.02,0.7,"triangle",0.13));
}

/* ===== round state ===== */
let questions=[],idx=0,roundCorrect=0,locked=false,misses=[];
let retry=false;   // 間違えたところだけの練習中（成績・記録には入れない）
let curVerb=null;       // null=総まとめ
let curMode=(store.mode==="write")?"write":"choice";   // "choice" | "write"（前回の形式を覚えておく）
let timeAttack = (typeof store.timeAttack==="boolean") ? store.timeAttack : true;
let roundStart=0, roundTime=0, timerHandle=null, roundBegin=0;

/* 問題の報告用：このラウンドで出た問題（新しい順）。feedback.js が使う */
window.FB_QUESTIONS=function(){
  if(!questions.length)return [];
  const out=[],n=Math.min(questions.length,idx+1);
  for(let i=n-1;i>=0;i--){
    const q=questions[i],body=String(q.sentence||"").replace("<BLANK>","___");
    out.push({label:(i+1)+". "+body+"（"+q.verb+"）",
      detail:"動詞活用／ラウンドの第"+(i+1)+"問（"+q.verb+"）\n問題："+body+"（"+(q.jp||"")+"）\n正解："+q.answer+
        "\n自分の答え："+(q._wrong===undefined?"（まだ答えていない）":(q._chosen||"")+(q._wrong?"　✕":"　○"))});
  }
  return out;
};
function goHome(){clearInterval(timerHandle);document.body.removeAttribute("data-verb");renderHome();show(homeScreen);}
function renderHome(){
  document.getElementById("hTries").textContent=store.tries;
  document.getElementById("hAns").textContent=store.answered;
  document.getElementById("hAcc").textContent=store.answered?Math.round(store.correct/store.answered*100)+"%":"—";
  document.getElementById("hBest").textContent=store.best===null?"—":store.best+"/10";
  // セクションボタン内に最速クリアタイム＋ランクを表示

    if(t==null){
      const tc=(store.bestTimesC||{})[s];
      el.innerHTML=tc!=null?'<span class="sb-none" title="ランクは記述式でつきます">選択 '+fmtTime(tc)+'<br>ランクは記述式で</span>':'<span class="sb-none">未記録</span>';
    }else{
      el.innerHTML='<span class="sb-t">'+fmtTime(t)+'</span>'+
        '<span class="sb-rank '+(rk?'r-'+rk:'r-none')+'">'+rk+'</span>';
    }
  });
  // モードボタンの状態反映
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("on",b.dataset.mode===curMode));
  renderStreak();
}

function startRound(verbFilter){
  retry=false;
  roundBegin=performance.now();
  curVerb = verbFilter || null;
  document.body.dataset.verb = curVerb || "mix";
  ensureAudio();if(actx&&actx.state==="suspended")actx.resume();playStart();
  questions=buildRound(curVerb);
  idx=0;roundCorrect=0;misses=[];locked=false;
  // タイトル表示
  document.getElementById("roundLabel").textContent =
    (curVerb?curVerb:"総まとめ") + " ／ " + (curMode==="choice"?"選択式":"記述式");
  show(quizScreen);render();
  // 計測（タイムアタック有効時のみ）
  clearInterval(timerHandle);
  const liveEl=document.getElementById("liveTimer");
  if(timeAttack){
    roundStart=performance.now();
    if(liveEl){liveEl.style.display="";liveEl.textContent="0.0秒";}
    timerHandle=setInterval(()=>{
      if(liveEl)liveEl.textContent=fmtTime(performance.now()-roundStart);
    },100);
  }else{
    if(liveEl)liveEl.style.display="none";
    roundStart=0;
  }
}

function render(){
  const q=questions[idx];
  const NQ=questions.length;
  document.getElementById("qcount").textContent=(idx+1)+" / "+NQ;
  document.getElementById("fill").style.width=(idx/NQ*100)+"%";
  let dots="";
  for(let i=0;i<NQ;i++){
    let cls = i<idx ? (questions[i]._wrong?"d-no":"d-ok") : (i===idx?"d-now":"d-todo");
    dots+='<span class="pdot '+cls+'"></span>';
  }
  document.getElementById("hearts").innerHTML=dots;
  document.getElementById("vchip").textContent=q.verb;
  document.getElementById("prompt").innerHTML=q.sentence.replace("<BLANK>",'<span class="blank">?</span>');
  document.getElementById("jp").textContent=q.jp;

  const optsBox=document.getElementById("opts");
  const writeBox=document.getElementById("writeBox");
  if(curMode==="choice"){
    optsBox.classList.remove("hidden");writeBox.classList.add("hidden");
    optsBox.innerHTML="";
    q.options.forEach((opt,i)=>{
      const b=document.createElement("button");
      b.className="opt";b.textContent=opt;b.dataset.val=opt;
      b.setAttribute("aria-label",(i+1)+". "+opt);
      b.addEventListener("click",()=>resolve(opt,b));
      optsBox.appendChild(b);
    });
    document.getElementById("hintLine").textContent="1〜4キー または クリックで解答";
  }else{
    optsBox.classList.add("hidden");writeBox.classList.remove("hidden");
    const inp=document.getElementById("writeInput");
    inp.value="";inp.disabled=false;inp.className="write-input";
    document.getElementById("writeBtn").disabled=false;
    document.getElementById("hintLine").textContent="活用を入力して Enter（アクセント記号は任意）";
    setTimeout(()=>inp.focus(),30);
  }
  const fb=document.getElementById("fb");fb.className="fb";fb.textContent="";
  locked=false;
}

// アクセント・大文字・前後空白を無視して比較
function norm(s){
  return (s||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function resolve(val, btn){
  if(locked)return;locked=true;
  const q=questions[idx];
  const correct = norm(val)===norm(q.answer);
  q._wrong=!correct;q._chosen=val;
  const fb=document.getElementById("fb");

  if(curMode==="choice"){
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled=true;
      if(b.dataset.val===q.answer)b.classList.add("correct");
      else if(b===btn)b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }else{
    const inp=document.getElementById("writeInput");
    inp.disabled=true;document.getElementById("writeBtn").disabled=true;
    inp.classList.add(correct?"ok":"no");
  }

  if(correct){
    roundCorrect++;
    fb.className="fb show ok";fb.textContent=pick(["正解","Correct","Bien","Bravo"]);
    playCorrect();
  }else{
    fb.className="fb show no";
    fb.innerHTML='正解は <span class="full">'+q.answer+'</span>';
    misses.push({sentence:q.sentence,full:q.full,answer:q.answer,chosen:(val||"（無回答）"),verb:q.verb});
    playWrong();
  }
  document.getElementById("fill").style.width=((idx+1)/questions.length*100)+"%";
  setTimeout(next,correct?750:1750);
}

function next(){idx++;if(idx<questions.length)render();else finishRound();}
/* 間違えたところだけを、もう一度（成績・記録には入らない） */
function startRetry(){
  const miss=questions.filter(q=>q._wrong);if(!miss.length)return;
  retry=true;
  ensureAudio();if(actx&&actx.state==="suspended")actx.resume();playStart();
  questions=shuffle(miss.map(q=>Object.assign({},q,{_wrong:undefined,_chosen:undefined})));
  idx=0;roundCorrect=0;misses=[];locked=false;
  document.getElementById("roundLabel").textContent="間違えたところだけ（記録には入りません）";
  clearInterval(timerHandle);const liveEl=document.getElementById("liveTimer");if(liveEl)liveEl.style.display="none";roundStart=0;
  show(quizScreen);render();
}
function finishRetry(){
  const N=questions.length,pct=Math.round(roundCorrect/N*100);
  document.getElementById("rScore").innerHTML=roundCorrect+'<small> / '+N+'</small>';
  document.getElementById("rPct").textContent=pct+"%";
  document.getElementById("rFace").textContent=pct===100?"◎":pct>=80?"○":pct>=50?"△":"✕";
  document.getElementById("rMsg").textContent=pct===100?"全部できました。この調子！":"あと少し。もう一度ためしてみよう。";
  const nd0=document.getElementById("nudge");if(nd0)nd0.innerHTML="";
  const rankEl=document.getElementById("rRank");rankEl.className="rank-badge";rankEl.innerHTML="";
  document.getElementById("rTime").innerHTML='<span class="best">間違えたところだけの練習なので、成績・記録には入りません。</span>';
  const rev=document.getElementById("review");
  rev.innerHTML=misses.length?'<div class="ttl">まだ間違えたところ</div>'+misses.map(m=>'<div class="rrow"><span>'+m.full+' <span style="color:var(--ink-soft)">['+m.verb+']</span></span><span><span class="miss">'+m.chosen+'</span> <span class="ar">→</span> <span class="got">'+m.answer+'</span></span></div>').join(""):'<div class="ttl">全部正解</div>';
  const rb=document.getElementById("retryBtn");rb.classList.toggle("hidden",!misses.length);rb.textContent="まだ間違えたところを、もう一度";
  show(resultScreen);
  if(roundCorrect===N)setTimeout(playFanfare,280);
}

function finishRound(){
  clearInterval(timerHandle);
  if(retry){finishRetry();return;}
  roundTime = timeAttack ? (performance.now()-roundStart) : null;
  store.tries++;store.answered+=ROUND;store.correct+=roundCorrect;
  store.timeMs=(store.timeMs||0)+Math.min(performance.now()-roundBegin,ROUND*90000);   // 勉強時間（放置分は1問90秒まで）
  if(store.best===null||roundCorrect>store.best)store.best=roundCorrect;
  // クリアタイム＝タイムアタック有効かつ全問正解時のみ、そのセクションのベストを更新
  const sec = curVerb || "mix";
  let newRecord=false;
  // ランク・自己ベストは記述式だけ。選択式のタイムは「選択式ベスト」として端末にだけ残す
  if(timeAttack && roundCorrect===ROUND){
    if(curMode==="write"){
      const prev=store.bestTimes[sec];
      if(prev===null||roundTime<prev){store.bestTimes[sec]=roundTime;newRecord=true;}
    }else{
      store.bestTimesC=store.bestTimesC||{};
      const prev=store.bestTimesC[sec];
      if(prev==null||roundTime<prev){store.bestTimesC[sec]=roundTime;newRecord=true;}
    }
  }
  Quiz.markToday();
  save();
  const pct=Math.round(roundCorrect/ROUND*100);
  document.getElementById("rScore").innerHTML=roundCorrect+'<small> / '+ROUND+'</small>';
  document.getElementById("rPct").textContent=pct+"%";
  document.getElementById("rFace").textContent= pct===100?"◎": pct>=80?"○": pct>=50?"△":"✕";
  document.getElementById("rMsg").textContent=
    pct===100?"全問正解です。":
    pct>=80 ?"よくできました。":
    pct>=50 ?"あと少し。復習しましょう。":
             "間違いを確認して再挑戦しましょう。";
  // タイム＋ランク表示
  const timeEl=document.getElementById("rTime");
  const rankEl=document.getElementById("rRank");
  if(!timeAttack){
    // タイムアタック無効：タイム・ランクは表示しない
    rankEl.className="rank-badge";rankEl.innerHTML="";
    timeEl.innerHTML="";
  }else if(roundCorrect===ROUND&&curMode==="choice"){
    rankEl.className="rank-badge";rankEl.innerHTML="";
    const bc=(store.bestTimesC||{})[sec];
    timeEl.innerHTML='クリアタイム '+fmtTime(roundTime)+'（選択式）'+
      (newRecord?' <span class="rec">★選択式ベスト</span>':(bc!=null?' <span class="best">（選択式ベスト '+fmtTime(bc)+'）</span>':''));
  }else if(roundCorrect===ROUND){
    const rk=rankOf(roundTime);
    rankEl.className="rank-badge show r-"+rk;
    rankEl.innerHTML='<span class="rk">'+rk+'</span><span class="rk-sub">RANK</span>';
    const best=store.bestTimes[sec];
    timeEl.innerHTML='クリアタイム '+fmtTime(roundTime)+
      (newRecord?' <span class="rec">★自己ベスト</span>':
        (best!=null?' <span class="best">（ベスト '+fmtTime(best)+' / '+rankOf(best)+'）</span>':''));
  }else{
    rankEl.className="rank-badge";rankEl.innerHTML="";
    timeEl.innerHTML='所要時間 '+fmtTime(roundTime)+
      ' <span class="best">（ランク・クリアタイムは全問正解時に記録）</span>';
  }
  const rev=document.getElementById("review");
  if(misses.length===0){
    rev.innerHTML='<div class="ttl">全問正解</div>';
  }else{
    let h='<div class="ttl">復習</div>';
    misses.forEach(m=>{
      h+='<div class="rrow"><span>'+m.full+
         ' <span style="color:var(--ink-soft)">['+m.verb+']</span></span>'+
         '<span><span class="miss">'+m.chosen+'</span> <span class="ar">→</span> <span class="got">'+m.answer+'</span></span></div>';
    });
    rev.innerHTML=h;
  }
  const rb=document.getElementById("retryBtn");rb.classList.toggle("hidden",!misses.length);rb.textContent="間違えたところだけを練習";
  /* 選択式でよくできたら、記述式へさそう */
  const nd=document.getElementById("nudge");nd.innerHTML="";
  if(curMode==="choice"&&pct>=80){
    nd.innerHTML='<div class="nudge"><div class="nd-t">'+(pct===100?"選択式で全問正解！":"選択式はもうばっちり！")+'</div>'+
      '<div class="nd-d">「見て選べる」の次は「自分で書ける」。<b>記述式</b>で全問正解すると、クリアタイムに <b>SSS〜C のランク</b>がつきます。</div>'+
      '<button class="play nd-go" id="ndGo">記述式で挑戦 →</button></div>';
    document.getElementById("ndGo").onclick=()=>{curMode="write";store.mode="write";save();startRound(curVerb);};
  }
  show(resultScreen);
  submitRound({section:sec,mode:curMode,durMs:Math.round(performance.now()-roundBegin),score:roundCorrect,total:ROUND,timeAttack:timeAttack&&curMode==="write",
    timeMs:timeAttack?Math.round(roundTime):null,
    misses:misses.map(m=>({full:m.full,verb:m.verb,chosen:m.chosen,answer:m.answer}))});
  if(roundCorrect===ROUND){ setTimeout(playFanfare, 280); }
}

document.getElementById("toHomeBtn").addEventListener("click",goHome);
document.getElementById("resetBtn").addEventListener("click",()=>{
  const keepTA=store.timeAttack;   // 設定は保持
  store={tries:0,answered:0,correct:0,best:null,bestTimes:{},timeAttack:keepTA,days:[]};
  SECTIONS.forEach(s=>store.bestTimes[s]=null);save();renderHome();
});

/* ============================================================
   共通ログイン（common.js）との連携
   ============================================================ */
const Q=window.Quiz;
function renderStreak(){
  const el=document.getElementById("streak");if(!el)return;
  const r=Q.streak();
  el.innerHTML='連続 '+r.n+'日'+(r.doneToday?' <small>今日済</small>':(r.n>0?' <small>今日はまだ</small>':''));
}
function applyStats(st){
  if(!st)return;
  store.tries=st.tries;store.answered=st.answered;store.correct=st.correct;store.best=st.best;
  SECTIONS.forEach(k=>{store.bestTimes[k]=(st.bestTimes&&typeof st.bestTimes[k]==="number")?st.bestTimes[k]:null;});
  save();renderHome();
}
function renderAcct(){
  const u=Q.user();
  const n=u?Q.pendingCount():0;
  document.getElementById("acctState").textContent=
    u?(u.name+(n?"（未送信 "+n+"件）":"")):"";
  const resetBtn=document.getElementById("resetBtn");
  if(resetBtn)resetBtn.style.display=u?"none":"";
}
function submitRound(r){
  const el=document.getElementById("rSync");
  const set=(t,c)=>{el.textContent=t;el.className="rsync"+(c?" "+c:"");};
  if(!Q.SYNC_ON){set("");return;}
  if(!Q.user()){set("ログインしていないため、結果は送信されません。","ng");return;}
  if(Q.isPractice&&Q.isPractice()){Q.submit("conj",r);set("練習用IDなので、記録は残りません。");return;}
  set("送信中…");
  const p=Q.submit("conj",r);renderAcct();
  p.then(st=>{
    renderAcct();
    if(st==="ok")set("結果を記録しました。","ok");
    else if(st==="auth")set("IDが無効です。先生に確認してください（結果は端末に保存済み）。","ng");
    else if(st==="rate")set("送信が多すぎるため保留中です（次に開いたときに送ります）。","ng");
    else set("未送信（通信できませんでした。次回開いたときに再送します）。","ng");
  });
}
Q.onStats(s=>{applyStats(s.apps&&s.apps.conj);renderAcct();});

if(Q.requireLogin()){
  renderAcct();
  Q.refresh().then(st=>{
    if(st==="auth"){Q.logout();location.replace("index.html");}
    else renderAcct();
  });
}
renderHome();show(homeScreen);
</script>
