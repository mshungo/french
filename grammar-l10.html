<script>
/* ===== Leçon 10：中性代名詞 en・y・le、単純未来、前未来（テキスト p.60-65） ===== */
window.LESSON={no:10,title:"中性代名詞・未来",sub:"en・y・le・futur simple・futur antérieur",
  lead:"中性代名詞（en, y, le）とその語順、単純未来と前未来を練習します。peindre・disparaître・plaire・croire の活用と、単純未来・前未来の活用ドリルは「動詞活用」のコーナーにあります。",
  sections:[
  {k:"en",t:"中性代名詞 en",d:"de＋名詞、不定冠詞・部分冠詞・数量のついた名詞（Grammaire 2）",c:"#7fa7c9",ci:"#5c86aa",cw:"#edf3f8",
   memo:'<p><b>en</b> は次のものの代わりになる。人称や性数で形は変わらない。</p>'+
   '<p>① <b>de＋名詞</b>：<span class="fr">parler de, avoir besoin de, se souvenir de, être content de</span> など。<br><span class="fr">Il parle de son voyage. → Il <b>en</b> parle.</span></p>'+
   '<p>② <b>不定冠詞・部分冠詞のついた名詞</b>：<span class="fr">Tu veux du thé ? → Oui, j\'<b>en</b> veux.</span></p>'+
   '<p>③ <b>数・量のついた名詞</b>：数や量の語は動詞のあとに残す。<br><span class="fr">J\'ai deux frères. → J\'<b>en</b> ai <b>deux</b>.</span>　<span class="fr">Il y a beaucoup de monde. → Il y <b>en</b> a <b>beaucoup</b>.</span></p>'+
   '<p>位置：動詞の直前。複合過去では助動詞の前（<span class="fr">j\'en ai acheté</span>）。不定詞があればその前（<span class="fr">je vais en acheter</span>）。否定は <span class="fr">je n\'en ai pas</span>。</p>'},
  {k:"y",t:"中性代名詞 y",d:"à＋名詞（物・事）、場所（Grammaire 2）",c:"#8db79b",ci:"#6c9a7f",cw:"#eef5f0",
   memo:'<p><b>y</b> は次のものの代わりになる。</p>'+
   '<p>① <b>à＋名詞（物・事）</b>：<span class="fr">penser à, répondre à, s\'intéresser à, réfléchir à, tenir à</span> など。<br><span class="fr">Tu penses à l\'examen ? → Oui, j\'<b>y</b> pense.</span></p>'+
   '<p>② <b>場所</b>（à, en, dans, chez, sur など＋場所）：<span class="fr">Je vais à Kyoto. → J\'<b>y</b> vais.</span></p>'+
   '<p>注意：<b>à＋人</b> は y にしない。<span class="fr">téléphoner à Léa → je lui téléphone</span>（間接目的の人称代名詞）、<span class="fr">penser à Léa → je pense à elle</span>（強勢形）。</p>'+
   '<p>位置は en と同じ：<span class="fr">j\'y suis allé(e)、on peut y aller、je n\'y vais pas</span></p>'},
  {k:"le",t:"中性代名詞 le",d:"属詞・文や節の内容・不定詞を受ける（Grammaire 2）",c:"#cf8aa0",ci:"#b16880",cw:"#faeef2",
   memo:'<p>中性代名詞 <b>le</b> は、名詞「それ」ではなく、次のものを受ける。<b>性数で変化しない</b>（la・les にならない）。母音の前では <b>l\'</b>。</p>'+
   '<p>① <b>属詞</b>（形容詞・名詞）：<span class="fr">Tu es fatiguée ? → Oui, je <b>le</b> suis.</span>　<span class="fr">Ils sont prêts ? → Oui, ils <b>le</b> sont.</span></p>'+
   '<p>② <b>文や節の内容</b>：<span class="fr">Je sais qu\'il est malade. → Je <b>le</b> sais.</span></p>'+
   '<p>③ <b>不定詞</b>：<span class="fr">Tu peux fermer la fenêtre ? → Oui, je vais <b>le</b> faire.</span></p>'+
   '<p>よく使う動詞：<span class="fr">savoir, croire, penser, dire, être</span></p>'},
  {k:"pro",t:"en・y・le の使い分け",d:"どの中性代名詞を使うか",c:"#d6a96f",ci:"#b88a4f",cw:"#faf2e7",
   memo:'<table><tr><td class="fr">en</td><td>de＋名詞、不定冠詞・部分冠詞・数量のついた名詞、de＋場所（～から）</td></tr>'+
   '<tr><td class="fr">y</td><td>à＋名詞（物・事）、場所（～に、～で）</td></tr>'+
   '<tr><td class="fr">le</td><td>属詞、文や節の内容、不定詞</td></tr></table>'+
   '<p>動詞がとる前置詞を見る：<span class="fr">croire à ～ → y</span>（Tu crois à cette histoire ? → Je n\'y crois pas.）、<span class="fr">croire que ～ → le</span>（Je le crois.）、<span class="fr">être sûr de ～ → en</span>（J\'en suis sûr.）</p>'},
  {k:"ord",t:"語順と命令文",d:"y en の順、人称代名詞と並べる、Vas-y・Donnez-m\'en（En plus… 1）",c:"#9b8fc4",ci:"#7a6da6",cw:"#f1eff8",
   memo:'<p>人称代名詞といっしょに使うときは、人称代名詞が先、<b>y・en はあと</b>。y と en が並ぶときは <b>y が先</b>：<span class="fr">il <b>y en</b> a</span>。</p>'+
   '<p><span class="fr">Je <b>lui en</b> ai parlé.</span>（彼にそのことを話した）　<span class="fr">Je <b>t\'en</b> prête deux.</span>　<span class="fr">Je <b>l\'y</b> ai emmenée.</span></p>'+
   '<p><b>否定命令</b>：ne＋代名詞＋動詞＋pas。<span class="fr">N\'<b>y</b> va pas !　N\'<b>en</b> parlons plus.</span></p>'+
   '<p><b>肯定命令</b>：動詞-代名詞-y / en。<span class="fr">Vas-y !　Donnez-m\'en un peu.</span></p>'+
   '<p>tu の命令形で s を落とす動詞（-er 動詞、aller）も、すぐあとに y・en が来るときは <b>s を残す</b>：<span class="fr">Va → Vas-y、Mange → Manges-en</span>。</p>'+
   '<p>moi・toi は en の前で <b>m\'・t\'</b>：<span class="fr">Donne-m\'en.</span></p>'},
  {k:"fut",t:"単純未来",d:"活用と用法、近接未来との書きかえ（Grammaire 3）",c:"#6fb0ad",ci:"#4c8e8b",cw:"#ebf5f4",
   memo:'<p>作り方：<b>不定詞</b>（-re で終わる動詞は e をとる）＋語尾 <span class="fr">-ai, -as, -a, -ons, -ez, -ont</span></p>'+
   '<table><tr><td class="fr">je parlerai</td><td class="fr">nous parlerons</td></tr><tr><td class="fr">tu parleras</td><td class="fr">vous parlerez</td></tr><tr><td class="fr">il / elle parlera</td><td class="fr">ils / elles parleront</td></tr></table>'+
   '<p><span class="fr">finir → je finirai　prendre → je prendrai　dire → je dirai</span></p>'+
   '<p>特別な語幹：<span class="fr">avoir → j\'aurai　être → je serai　aller → j\'irai　faire → je ferai　venir → je viendrai　tenir → je tiendrai　voir → je verrai　savoir → je saurai　pouvoir → je pourrai　vouloir → je voudrai　devoir → je devrai　recevoir → je recevrai　envoyer → j\'enverrai　falloir → il faudra　pleuvoir → il pleuvra</span></p>'+
   '<p>つづりに注意：<span class="fr">acheter → j\'achèterai　appeler → j\'appellerai　se lever → je me lèverai</span></p>'+
   '<p>用法：①これからの予定・予測。②tu・vous で軽い命令・依頼（<span class="fr">Tu m\'appelleras demain.</span>）。③ <b>quand</b> のあとも、未来のことなら単純未来（<span class="fr">Quand tu arriveras, …</span>）。</p>'},
  {k:"fa",t:"前未来",d:"未来のある時点までに終わっていること（Grammaire 4）",c:"#c99b6a",ci:"#a57a48",cw:"#f9f1e8",
   memo:'<p>作り方：助動詞（avoir / être）の<b>単純未来</b>＋過去分詞。avoir か être かの選び方と、過去分詞の一致は複合過去と同じ。</p>'+
   '<table><tr><td class="fr">j\'aurai fini</td><td class="fr">nous aurons fini</td></tr><tr><td class="fr">tu auras fini</td><td class="fr">vous aurez fini</td></tr><tr><td class="fr">il aura fini</td><td class="fr">ils auront fini</td></tr></table>'+
   '<table><tr><td class="fr">je serai parti(e)</td><td class="fr">nous serons parti(e)s</td></tr><tr><td class="fr">tu seras parti(e)</td><td class="fr">vous serez parti(e)(s)</td></tr><tr><td class="fr">il sera parti / elle sera partie</td><td class="fr">ils seront partis / elles seront parties</td></tr></table>'+
   '<p>用法：未来のある時点までに<b>完了している</b>こと。<span class="fr">J\'aurai fini ce travail avant lundi.</span></p>'+
   '<p><span class="fr">quand, dès que（～するとすぐに）, après que</span> のあとで「～し終えたら」：<span class="fr">Dès que j\'aurai fini, je sortirai.</span>（終えるのが先、出かけるのがあと）</p>'}
]};

/* ---------- 中性代名詞 en ---------- */
FROM(10,0);
C("en","Tu as des frères ? — Oui, j'___ ai deux.","en",["en","y","les"],"des frères（不定冠詞＋名詞）→ en。数（deux）は動詞のあとに残す。",{ja:"きょうだいはいる？―うん、2人いるよ。"});
C("en","Vous voulez du thé ? — Oui, j'___ veux bien.","en",["en","le","y"],"du thé（部分冠詞＋名詞）→ en。",{ja:"お茶はいかがですか？―ええ、いただきます。"});
C("en","Il y a encore du pain ? — Oui, il y ___ a.","en",["en","le","y"],"du pain → en。il y a と組み合わせると il y en a。",{ja:"まだパンある？―うん、あるよ。"});
C("en","Léa parle souvent de son voyage ? — Oui, elle ___ parle souvent.","en",["en","y","le"],"parler de ～ の「de＋名詞」→ en。",{ja:"レアはよく旅行の話をするの？―うん、よく話すよ。"});
C("en","Tu as besoin de ce livre ? — Non, je n'___ ai pas besoin.","en",["en","y","l'"],"avoir besoin de ～ → en。否定では n'en。",{ja:"この本いる？―ううん、いらない。"});
C("en","Combien de cafés prends-tu par jour ? — J'___ prends trois.","en",["en","les","y"],"cafés（数をたずねている名詞）→ en。trois はあとに残す。",{ja:"1日にコーヒーを何杯飲む？―3杯飲むよ。"});
C("en","Hugo achète des pommes ? — Oui, il ___ achète un kilo.","en",["en","les","y"],"des pommes → en。un kilo（量）はあとに残す。",{ja:"ユゴーはりんごを買う？―うん、1キロ買うよ。"});
C("en","Tu te souviens de cette fête ? — Oui, je m'___ souviens très bien.","en",["en","y","le"],"se souvenir de ～ → en。代名動詞では再帰代名詞のあと：je m'en souviens。",{ja:"あのパーティー覚えてる？―うん、よく覚えてるよ。"});
C("en","Elle est contente de son nouveau travail ? — Oui, elle ___ est très contente.","en",["en","y","le"],"être content(e) de ～ → en。",{ja:"彼女は新しい仕事に満足している？―うん、とても満足してる。"});
C("en","Tu reviens de la bibliothèque ? — Oui, j'___ reviens.","en",["en","y","le"],"de＋場所（～から）も en で受ける。",{ja:"図書館から戻ったところ？―うん、そうだよ。"});
C("en","Vous avez des enfants ? — Non, nous n'___ avons pas.","en",["en","les","y"],"否定でも en：nous n'en avons pas。",{ja:"お子さんはいますか？―いいえ、いません。"});
C("en","Il y a beaucoup de monde ? — Oui, il y ___ a beaucoup.","en",["en","le","y"],"beaucoup de monde → en。beaucoup はあとに残す。",{ja:"人は多い？―うん、たくさんいる。"});
C("en","Des croissants ? J'___ ai acheté quatre ce matin.","en",["en","les","y"],"複合過去では、en は助動詞（ai）の前。en のときは過去分詞を一致させない。",{ja:"クロワッサン？けさ4つ買ったよ。"});
C("en","Du chocolat ? Je vais ___ acheter demain.","en",["en","le","y"],"acheter（不定詞）の目的語なので、en は不定詞の直前：Je vais en acheter。",{ja:"チョコ？明日買うつもり。"});
T("en","en を使って書きかえ","Je mange de la salade.",["J'en mange."],"de la salade（部分冠詞＋名詞）→ en。",{extra:["la","y"]});
T("en","en を使って書きかえ","Nous avons deux voitures.",["Nous en avons deux."],"deux voitures → en … deux。",{extra:["les","y"]});
T("en","en を使って書きかえ","Elle parle de ses vacances.",["Elle en parle."],"parler de ～ → en。",{extra:["y","les"]});
T("en","en を使って書きかえ","Je n'ai pas de stylo.",["Je n'en ai pas."],"否定の pas de ～ も en で受ける。",{extra:["le","y"]});
T("en","en を使って書きかえ","J'ai acheté des fleurs.",["J'en ai acheté."],"en は助動詞の前。過去分詞は一致しない。",{extra:["les","achetées"]});
B("en","彼にはそれは必要ない。","Il n'en a pas besoin.",["y","le"],"avoir besoin de ～ → en。否定は n'en … pas。");
B("en","（牛乳は）もうないよ。","Il n'y en a plus.",["le","pas"],"il y a＋en → il y en a。否定 ne … plus：il n'y en a plus。");

/* ---------- 中性代名詞 y ---------- */
C("y","Tu vas à la piscine ce soir ? — Oui, j'___ vais.","y",["y","en","la"],"à la piscine（場所）→ y。",{ja:"今晩プールに行く？―うん、行くよ。"});
C("y","Léa habite à Lyon ? — Oui, elle ___ habite depuis deux ans.","y",["y","en","le"],"à Lyon（場所）→ y。",{ja:"レアはリヨンに住んでるの？―うん、2年前から住んでる。"});
C("y","Tu penses à ton examen ? — Oui, j'___ pense tout le temps.","y",["y","en","le"],"penser à ～（物・事）→ y。",{ja:"試験のこと考えてる？―うん、ずっと考えてる。"});
C("y","Vous avez répondu à ce message ? — Non, je n'___ ai pas encore répondu.","y",["y","en","lui"],"répondre à ～（物）→ y。相手が人なら lui。",{ja:"このメッセージに返事しましたか？―いいえ、まだです。"});
C("y","Tu es déjà allée en Italie ? — Oui, j'___ suis allée l'année dernière.","y",["y","en","l'"],"en Italie（場所）→ y。複合過去では助動詞の前。",{ja:"イタリアに行ったことある？―うん、去年行ったよ。"});
C("y","Hugo s'intéresse à la photo ? — Oui, il s'___ intéresse beaucoup.","y",["y","en","la"],"s'intéresser à ～ → y。再帰代名詞のあと：il s'y intéresse。",{ja:"ユゴーは写真に興味があるの？―うん、とても。"});
C("y","Mon sac est sur la table ? — Oui, il ___ est.","y",["y","en","le"],"sur la table（場所）も y。à 以外の前置詞でも、場所なら y。",{ja:"私のバッグ、テーブルの上にある？―うん、あるよ。"});
C("y","Le chat est dans le jardin ? — Non, il n'___ est plus.","y",["y","en","le"],"dans le jardin（場所）→ y。ne … plus「もう～ない」。",{ja:"猫は庭にいる？―ううん、もういない。"});
C("y","Tu penses à ta grand-mère ? — Oui, je pense souvent à ___.","elle",["elle","y","la"],"penser à＋人は y にしない。à のあとに強勢形を残す：je pense à elle。",{ja:"おばあちゃんのことを考える？―うん、よく考えるよ。"});
C("y","Tu as téléphoné à Léa ? — Oui, je ___ ai téléphoné.","lui",["lui","y","la"],"téléphoner à＋人 → 間接目的の人称代名詞 lui。y は物・事・場所。",{ja:"レアに電話した？―うん、したよ。"});
C("y","Vous allez au cinéma demain ? — Non, nous n'___ allons pas.","y",["y","en","le"],"au cinéma（場所）→ y。",{ja:"明日映画に行きますか？―いいえ、行きません。"});
C("y","Tu réfléchis à ma proposition ? — Oui, j'___ réfléchis.","y",["y","en","la"],"réfléchir à ～ → y。",{ja:"私の提案、考えてくれてる？―うん、考えてるよ。"});
C("y","On peut aller au parc ? — Oui, on peut ___ aller cet après-midi.","y",["y","en","le"],"aller（不定詞）の前に y：on peut y aller。",{ja:"公園に行ける？―うん、午後なら行けるよ。"});
T("y","y を使って書きかえ","Je vais à la gare.",["J'y vais."],"à la gare（場所）→ y。",{extra:["en","la"]});
T("y","y を使って書きかえ","Nous sommes restés chez Hugo.",["Nous y sommes restés."],"chez Hugo（場所）→ y。助動詞の前に置く。",{extra:["en","lui"]});
T("y","y を使って書きかえ","Elle ne pense pas à son travail.",["Elle n'y pense pas."],"penser à ～ → y。否定は n'y … pas。",{extra:["en","le"]});
T("y","y を使って書きかえ","Ils travaillent dans ce café.",["Ils y travaillent."],"dans ce café（場所）→ y。",{extra:["en","le"]});
B("y","私はもうそこへは行かない。","Je n'y vais plus.",["en","pas"],"ne … plus のときも y を ne のすぐあとに置く：n'y … plus。");
B("y","彼女は先週そこへ行った。","Elle y est allée la semaine dernière.",["en","allé"],"複合過去：y は助動詞の前。aller は être をとるので allée。");

/* ---------- 中性代名詞 le ---------- */
C("le","Tu es fatiguée ? — Oui, je ___ suis un peu.","le",["le","la","en"],"属詞（fatiguée）を受ける le。主語が女性でも la にならない。",{ja:"疲れてる？―うん、少し。"});
C("le","Léa est étudiante. Ses amies ___ sont aussi.","le",["le","les","en"],"属詞（étudiante）→ le。主語が複数でも les にならない。",{ja:"レアは学生だ。彼女の友だちもそうだ。"});
