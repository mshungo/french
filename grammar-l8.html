<script>
/* ===== Leçon 8：savoir・voir・recevoir・boire、半過去、大過去、受動態、知覚動詞・使役動詞（テキスト p.48-53） ===== */
window.LESSON={no:8,title:"半過去と受動態",sub:"imparfait・plus-que-parfait・passif",
  lead:"savoir・voir・recevoir・boire の現在形、直説法半過去、大過去、受動態、そして En plus… の知覚動詞・使役動詞・se faire を練習します。時制の使い分けは、いろいろな文の中で「どれを選ぶか」を何度も考えると身につきます。",
  sections:[
  {k:"sv",t:"savoir・voir・recevoir・boire",d:"現在形と過去分詞（Grammaire 1）",c:"#c99b6a",ci:"#a57a48",cw:"#f9f1e8",
   memo:'<table><tr><th>savoir</th><th>voir</th><th>recevoir</th><th>boire</th></tr>'+
   '<tr><td class="fr">je sais</td><td class="fr">je vois</td><td class="fr">je reçois</td><td class="fr">je bois</td></tr>'+
   '<tr><td class="fr">tu sais</td><td class="fr">tu vois</td><td class="fr">tu reçois</td><td class="fr">tu bois</td></tr>'+
   '<tr><td class="fr">il sait</td><td class="fr">il voit</td><td class="fr">il reçoit</td><td class="fr">il boit</td></tr>'+
   '<tr><td class="fr">nous savons</td><td class="fr">nous voyons</td><td class="fr">nous recevons</td><td class="fr">nous buvons</td></tr>'+
   '<tr><td class="fr">vous savez</td><td class="fr">vous voyez</td><td class="fr">vous recevez</td><td class="fr">vous buvez</td></tr>'+
   '<tr><td class="fr">ils savent</td><td class="fr">ils voient</td><td class="fr">ils reçoivent</td><td class="fr">ils boivent</td></tr></table>'+
   '<p>過去分詞：<span class="fr">savoir → su, voir → vu, recevoir → reçu, boire → bu</span></p>'+
   '<p>recevoir は c の下に ç（セディーユ）：o の前では ç、e の前では c。<span class="fr">je reçois / nous recevons</span></p>'+
   '<p>voir と同じ型：<span class="fr">revoir（再会する）</span>。recevoir と同じ型：<span class="fr">s\'apercevoir de ～（～に気づく）、concevoir（思いつく）</span></p>'},
  {k:"imp",t:"半過去のつくり方",d:"語幹（nous の形から -ons をとる）＋ -ais, -ais, -ait, -ions, -iez, -aient（Grammaire 2）",c:"#7fa7c9",ci:"#5c86aa",cw:"#edf3f8",
   memo:'<p>語幹＝直説法現在 <b>nous</b> の形から -ons をとったもの：<span class="fr">parler（nous parlons）→ parl-</span></p>'+
   '<table><tr><td class="fr">je parlais</td><td class="fr">nous parlions</td></tr><tr><td class="fr">tu parlais</td><td class="fr">vous parliez</td></tr><tr><td class="fr">il parlait</td><td class="fr">ils parlaient</td></tr></table>'+
   '<p><span class="fr">finir（nous finissons）→ je finissais　faire（nous faisons）→ je faisais　avoir（nous avons）→ j\'avais</span></p>'+
   '<p>例外は être だけ：語幹 ét-：<span class="fr">j\'étais, tu étais, il était, nous étions, vous étiez, ils étaient</span></p>'+
   '<p><span class="fr">pleuvoir → il pleuvait、falloir → il fallait</span></p>'+
   '<p>-ger・-cer の動詞：a・o の前だけ e・ç が入る：<span class="fr">je mangeais / nous mangions、je commençais / nous commencions</span></p>'+
   '<p>voir・boire・savoir・recevoir：<span class="fr">nous voyions, nous buvions, nous savions, nous recevions</span>（語幹は nous の形から）</p>'},
  {k:"use",t:"半過去の用法・複合過去との使い分け",d:"状態・進行中／習慣と、継続期間・完了（Grammaire 2）",c:"#8db79b",ci:"#6c9a7f",cw:"#eef5f0",
   memo:'<p><b>① 過去の一時点での状態・進行中の行為</b>：<span class="fr">Elle était dans la cuisine quand le téléphone a sonné.</span>（背景は半過去、起きた出来事は複合過去）</p>'+
   '<p><b>② 過去の反復する行為・習慣</b>：<span class="fr">J\'allais chez ma grand-mère chaque dimanche.</span></p>'+
   '<p>継続的な状態でも、現在から見て<b>完了している</b>ときは複合過去：</p>'+
   '<p><span class="fr">Il a habité deux ans à Lyon.</span>（継続期間が明らか）<br><span class="fr">Il a habité à Paris de 1996 à 2002.</span>（始まりと終わりが明らか）<br><span class="fr">Il habitait à Paris quand son fils est né.</span>（過去の一時点で継続中）</p>'},
  {k:"pqp",t:"大過去",d:"助動詞の半過去＋過去分詞（Grammaire 3）",c:"#b48aa8",ci:"#8f667f",cw:"#f6eef3",
   memo:'<p>助動詞（avoir または être）の<b>半過去</b>＋過去分詞。avoir か être かの選び方、être のときの一致は複合過去と同じ。</p>'+
   '<table><tr><td class="fr">j\'avais fini</td><td class="fr">nous avions fini</td></tr><tr><td class="fr">tu avais fini</td><td class="fr">vous aviez fini</td></tr><tr><td class="fr">il avait fini</td><td class="fr">ils avaient fini</td></tr></table>'+
   '<table><tr><td class="fr">j\'étais venu(e)</td><td class="fr">nous étions venu(e)s</td></tr><tr><td class="fr">il était venu / elle était venue</td><td class="fr">ils étaient venus / elles étaient venues</td></tr></table>'+
   '<p>代名動詞：<span class="fr">je m\'étais couché(e), elle s\'était couchée, ils s\'étaient couchés</span></p>'+
   '<p>用法：過去のある時点より<b>前に完了していた</b>こと（「～してしまっていた」）：<span class="fr">Quand je suis arrivé chez lui, il était déjà parti.</span></p>'+
   '<p>否定は助動詞をはさむ：<span class="fr">Il n\'avait pas fini.</span>　déjà などの副詞は過去分詞の直前：<span class="fr">Il était déjà parti.</span></p>'},
  {k:"tps",t:"時制の使い分け",d:"半過去・複合過去・大過去を、文脈から選ぶ",c:"#d6a96f",ci:"#b88a4f",cw:"#faf2e7",
   memo:'<p>出来事の順番と背景で決める：</p>'+
   '<p>・<b>半過去</b>：そのとき続いていた状態・進行中の行為・習慣（背景）</p>'+
   '<p>・<b>複合過去</b>：過去に起きた（完了した）出来事（前景）</p>'+
   '<p>・<b>大過去</b>：その出来事より<b>前に</b>終わっていたこと</p>'+
   '<p><span class="fr">Quand il est arrivé（複合過去）, elle dormait（半過去）. Elle s\'était couchée（大過去）à neuf heures.</span></p>'},
  {k:"pas",t:"受動態",d:"être の活用形＋過去分詞＋ par / de ～（Grammaire 4）",c:"#cf8aa0",ci:"#b16880",cw:"#faeef2",
   memo:'<p><b>être の活用形＋過去分詞＋ par / de ～</b>：「～される」。過去分詞は主語の性と数に一致する。</p>'+
   '<p><span class="fr">Marie est invitée par ses anciens élèves.</span>（← Ses anciens élèves invitent Marie.）</p>'+
   '<p>受動態になれるのは、<b>直接目的補語をとる他動詞</b>だけ。</p>'+
   '<p>「～によって」は多くは <b>par</b>。状態・継続的・習慣的な動作を表す動詞では <b>de</b>：<span class="fr">Paul est aimé de tout le monde. Cette ville est entourée de montagnes.</span></p>'+
   '<p>動作主が一般の人々（on）の場合や、自明な場合は省略される：<span class="fr">Le magasin est fermé après sept heures du soir.</span></p>'+
   '<p>時制は être の部分で表す：<span class="fr">Vous étiez attendu(e)(s). Cette société a été fondée par mon grand-père.</span></p>'},
  {k:"per",t:"知覚動詞・使役動詞・se faire",d:"voir, entendre / laisser, faire / se faire（En plus…）",c:"#6fb0ad",ci:"#4c8e8b",cw:"#ebf5f4",
   memo:'<p><b>知覚動詞</b>（voir, regarder, entendre, écouter, sentir）：「～が…するのを見る・聞く」</p>'+
   '<p><span class="fr">Nous regardons nos enfants nager.</span> ／ <span class="fr">J\'ai vu mon frère porter un grand colis.</span></p>'+
   '<p>直接目的補語が代名詞のとき、現在形では知覚動詞の直前、複合過去では助動詞 avoir の前。過去分詞は<b>直接目的補語に一致する</b>：<span class="fr">Il a entendu sa mère fermer la porte. → Il l\'a entendue fermer la porte.</span></p>'+
   '<p><b>laisser</b>「～させておく」：語順も一致も知覚動詞と同じ：<span class="fr">Je l\'ai laissée dessiner.</span></p>'+
   '<p><b>faire</b>「～させる」：<span class="fr">Ce film a fait pleurer Sylvie.</span>　代名詞にしたとき、過去分詞 fait は<b>一致しない</b>：<span class="fr">Le professeur l\'a fait entrer.</span></p>'+
   '<p><span class="fr">faire＋不定詞＋名詞B（par / à）</span>：「Bに A を…させる」：<span class="fr">J\'ai fait réparer ma voiture par mon frère. Je fais regarder cette émission à mon père.</span></p>'+
   '<p><b>se faire＋不定詞</b>「…してもらう、…される」：<span class="fr">Je me suis fait renverser par une voiture. Elle se fait couper les cheveux.</span>（過去分詞 fait は一致しない）</p>'}
]};

/* ---------- savoir・voir・recevoir・boire ---------- */
FROM(8,0);
W("sv","Tu ___ où habite Hugo ?（savoir）","sais","savoir：tu sais。",{ja:"ユゴーがどこに住んでいるか知ってる？"});
W("sv","Vous ___ le latin ?（savoir）","savez","savoir：vous savez。",{ja:"ラテン語ができますか？"});
W("sv","Je ne ___ pas son nom.（savoir）","sais","savoir：je sais。",{ja:"私は彼の名前を知らない。"});
W("sv","De cette fenêtre, nous ___ bien la mer.（voir）","voyons","voir：nous voyons（y が入る）。",{ja:"この窓から海がよく見える。"});
W("sv","Léa ___ souvent ses cousins.（voir）","voit","voir：elle voit。",{ja:"レアはよくいとこたちに会う。"});
W("sv","Ils ___ le mont Fuji de ce pont.（voir）","voient","voir：ils voient。",{ja:"彼らはこの橋から富士山が見える。"});
W("sv","Hugo ___ beaucoup d'amis pour son anniversaire.（recevoir）","reçoit","recevoir：il reçoit（o の前なので ç）。",{ja:"ユゴーは誕生日にたくさんの友だちを迎える。"});
W("sv","Nous ___ souvent des lettres de Léa.（recevoir）","recevons","recevoir：nous recevons（e の前なので c）。",{ja:"私たちはよくレアから手紙を受け取る。"});
W("sv","Je ___ ton message.（recevoir）","reçois","recevoir：je reçois。",{ja:"きみのメッセージを受け取ったよ。"});
W("sv","Ils ___ des invités ce soir.（recevoir）","reçoivent","recevoir：ils reçoivent。",{ja:"彼らは今夜、客を迎える。"});
W("sv","Yui ne ___ pas de lait.（boire）","boit","boire：elle boit。",{ja:"ゆいは牛乳を飲まない。"});
W("sv","Nous ___ du thé vert.（boire）","buvons","boire：nous buvons（語幹が buv-）。",{ja:"私たちは緑茶を飲む。"});
W("sv","Qu'est-ce que vous ___ ?（boire）","buvez","boire：vous buvez。",{ja:"何をお飲みになりますか？"});
W("sv","Ils ___ du café le matin.（boire）","boivent","boire：ils boivent（語幹が boiv-）。",{ja:"彼らは朝、コーヒーを飲む。"});
C("sv","Tu ___ de l'eau ?（boire）","bois",["bois","boit","boies"],"boire：tu bois。",{ja:"水を飲む？"});
C("sv","Elle ___ un mail de Hugo.（recevoir）","reçoit",["reçoit","recoit","reçevoit"],"recevoir：elle reçoit。o の前の c は ç にする。",{ja:"彼女はユゴーからメールを受け取る。"});
C("sv","Je ___ qu'il est malade.","sais",["sais","connais","vois"],"「～ということを知っている」は savoir。（connaître は人・場所などを知っている）",{ja:"彼が病気だということは知っている。"});
C("sv","avoir → eu のように、recevoir の過去分詞は？","reçu",["reçu","recevé","reçoivé"],"recevoir → reçu。（savoir → su, voir → vu, boire → bu）",{cw:false});
C("sv","Tu as ___ ce film ?（voir）","vu",["vu","voi","vois"],"voir → vu。",{ja:"この映画、見た？"});
C("sv","Nous avons ___ du thé.（boire）","bu",["bu","buvu","boi"],"boire → bu。",{ja:"私たちはお茶を飲んだ。"});
T("sv","主語を nous に","Je reçois un colis.",["Nous recevons un colis."],"recevoir：nous recevons。");
T("sv","主語を ils に","Tu bois du thé.",["Ils boivent du thé."],"boire：ils boivent。");
B("sv","きみはユゴーがどこに住んでいるか知ってる？","Tu sais où habite Hugo ?",["sait","habites"],"savoir：tu sais。");
B("sv","ゆいは窓から海を見る。","Yui voit la mer de sa fenêtre.",["voient","vois"],"voir：elle voit。");

/* ---------- 半過去のつくり方 ---------- */
W("imp","Quand Hugo ___ lycéen, il jouait au rugby.（être）","était","être の半過去は語幹 ét-：il était。",{ja:"ユゴーは高校生のころ、ラグビーをしていた。"});
W("imp","Nous ___ souvent au Jardin du Luxembourg.（aller）","allions","nous allons → all-＋-ions：nous allions。",{ja:"私たちはよくリュクサンブール公園に行っていた。"});
W("imp","J'___ à Lyon à cette époque.（habiter）","habitais","habiter → j'habitais（母音の前で je → j'）。",{ja:"当時、私はリヨンに住んでいた。"});
W("imp","Yui ___ de longs cheveux.（avoir）","avait","nous avons → av-＋-ait：elle avait。",{ja:"ゆいは長い髪をしていた。"});
W("imp","Tu ___ le journal chaque matin.（lire）","lisais","nous lisons → lis-＋-ais：tu lisais。",{ja:"きみは毎朝新聞を読んでいた。"});
W("imp","Vous ___ la radio.（écouter）","écoutiez","nous écoutons → écout-＋-iez：vous écoutiez。",{ja:"あなたたちはラジオを聞いていた。"});
W("imp","Ils ___ les Beatles à l'époque.（écouter）","écoutaient","ils → -aient：ils écoutaient。",{ja:"彼らは当時ビートルズを聞いていた。"});
W("imp","Léa ___ sa grand-mère le dimanche.（voir）","voyait","nous voyons → voy-＋-ait：elle voyait。",{ja:"レアは日曜日におばあさんに会っていた。"});
W("imp","Nous ___ du lait le matin.（boire）","buvions","nous buvons → buv-＋-ions：nous buvions。",{ja:"私たちは朝、牛乳を飲んでいた。"});
W("imp","Mon oncle ___ souvent.（voyager）","voyageait","voyager → il voyageait（-ait の前なので e が残る）。",{ja:"おじはよく旅行していた。"});
W("imp","Je ___ trop vite.（manger）","mangeais","manger → je mangeais（a の前で g の音を保つため e が残る）。",{ja:"私は食べるのが速すぎた。"});
W("imp","Nous ___ à neuf heures.（commencer）","commencions","-ions の前では ç は不要：nous commencions。",{ja:"私たちは9時に始めていた。"});
W("imp","Il ___ toute la journée.（pleuvoir）","pleuvait","pleuvoir → il pleuvait。",{ja:"一日じゅう雨が降っていた。"});
C("imp","Ils ___ à six heures.（finir）","finissaient",["finissaient","finisaient","finissent"],"nous finissons → finiss-＋-aient。",{ja:"彼らは6時に終わっていた。"});
C("imp","Je ___ la vaisselle.（faire）","faisais",["faisais","fesais","faisait"],"nous faisons → fais-＋-ais。",{ja:"私は皿洗いをしていた。"});
C("imp","Nous ___ la mer de notre chambre.（voir）","voyions",["voyions","voions","voyons"],"nous voyons → voy-＋-ions：nous voyions。",{ja:"私たちは部屋から海が見えていた。"});
C("imp","Elles ___ ce qu'il fallait faire.（savoir）","savaient",["savaient","sauvaient","savent"],"nous savons → sav-＋-aient。",{ja:"彼女たちは何をすべきか知っていた。"});
C("imp","Je ___ beaucoup de lettres.（recevoir）","recevais",["recevais","reçevais","reçois"],"nous recevons → recev-＋-ais。ç は a・o・u の前だけ。e の前は c。",{ja:"私はたくさん手紙を受け取っていた。"});
T("imp","半過去に","Il pleut beaucoup.",["Il pleuvait beaucoup."],"pleuvoir → il pleuvait。");
T("imp","半過去に","Nous mangeons au restaurant.",["Nous mangions au restaurant."],"nous mangeons → mang-＋-ions：-ions の前では e は入れない（mangions）。");
T("imp","半過去に","Elle est lycéenne.",["Elle était lycéenne."],"être の半過去：elle était。");
B("imp","子どものころ、私は海の近くに住んでいた。","Quand j'étais petite, j'habitais près de la mer.",["étais","habitait"],"どちらも半過去：j'étais, j'habitais。");

/* ---------- 半過去の用法・複合過去との使い分け ---------- */
C("use","Quand je suis arrivée, Hugo ___ dans la cuisine.","était",["était","a été","avait été"],"そのとき続いていた状態は半過去。arrivée（出来事）は複合過去。",{ja:"私が着いたとき、ユゴーは台所にいた。"});
C("use","Il ___ deux ans à Lyon.","a habité",["a habité","habitait","avait habité"],"「2年間」と期間が区切られ、現在から見て完了している → 複合過去。",{ja:"彼はリヨンに2年住んでいた。"});
C("use","Il ___ à Paris quand son fils est né.","habitait",["habitait","a habité","est habité"],"息子が生まれた一時点で続いていた状態 → 半過去。",{ja:"息子が生まれたとき、彼はパリに住んでいた。"});
C("use","Chaque dimanche, j'___ chez ma grand-mère.","allais",["allais","suis allée","étais allée"],"chaque dimanche（毎週日曜日）は過去の習慣 → 半過去。",{ja:"毎週日曜日、私はおばあさんの家に行っていた。"});
C("use","Il ___ à Paris de 1996 à 2002.","a habité",["a habité","habitait","avait habité"],"1996年から2002年と、始まりと終わりがはっきりしている → 複合過去。",{ja:"彼は1996年から2002年までパリに住んだ。"});
